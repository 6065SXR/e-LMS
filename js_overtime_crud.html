<script>
  /**
   * Sub-modul Overtime CRUD, Cascading PM Filters, Sub-Menu Tabs (Akumulasi vs KJK),
   * KJK Table Engine, Multi-Slot Attendance & Dynamic Pagination
   * System: e-LMS Data Center KSPS
   */

  var currentOvertimeCache = [];
  var currentFilteredOvertimeCache = [];
  var overtimeMasterEmployees = [];
  var currentKjkMap = {};
  var currentAttendanceMap = {};
  
  // State Paginasi & Sub-Tab
  var currentOvertimeSubTab = 'overtime'; // 'overtime' atau 'kjk'
  var currentOvtPage = 1;
  var ovtItemsPerPage = 10;
  var currentKjkPage = 1;
  var kjkItemsPerPage = 10;

  /* =========================================================
   * 1. MANAJEMEN REKAPITULASI KELEBIHAN JAM KERJA (KJK)
   * ========================================================= */

  function openKjkModal() {
    var modal = document.getElementById("kjkModal");
    if (!modal) return;

    var periodFilter = document.getElementById("overtimePeriodFilter");
    var periodVal = periodFilter ? periodFilter.value : UtilitiesFormatDateMonth();
    var parts = periodVal.split("-");
    var monthNum = parseInt(parts[1], 10) || 9;

    var monthNamesEn = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
    var defaultMonth = monthNamesEn[monthNum - 1] || "September";

    var monthSelect = document.getElementById("kjkMonthSelect");
    if (monthSelect) monthSelect.value = defaultMonth;

    var uid = currentUser ? currentUser.user_id : 'USR-0003';
    var existingKjk = 0;
    if (currentKjkMap && currentKjkMap[uid + "_" + defaultMonth.toLowerCase()] !== undefined) {
      existingKjk = currentKjkMap[uid + "_" + defaultMonth.toLowerCase()];
    }

    var totalKjkInput = document.getElementById("kjkTotalHoursInput");
    if (totalKjkInput) totalKjkInput.value = existingKjk;

    modal.classList.remove("hidden");
  }

  function closeKjkModal() {
    var modal = document.getElementById("kjkModal");
    if (modal) modal.classList.add("hidden");
  }

  function handleSaveKjk(e) {
    e.preventDefault();

    var monthVal = document.getElementById("kjkMonthSelect").value;
    var totalHoursVal = parseFloat(document.getElementById("kjkTotalHoursInput").value) || 0;
    var uid = currentUser ? currentUser.user_id : 'USR-0003';
    var userSig = currentUser ? (currentUser.signature || "") : "";

    var btn = document.getElementById("btnSubmitKjk");
    if (btn) {
      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin mr-1"></i> Menyimpan...';
    }

    var payload = {
      user_id: uid,
      bulan: monthVal,
      total_kjk: totalHoursVal,
      user_signature: userSig
    };

    callBackend('saveKjkEntry', [payload], function(res) {
      if (btn) {
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-floppy-disk"></i> <span>Simpan Data KJK</span>';
      }

      if (res && res.success) {
        showToast(res.message || "Data KJK berhasil disimpan ke sheet KJK!");
        if (!currentKjkMap) currentKjkMap = {};
        currentKjkMap[uid + "_" + monthVal.toLowerCase()] = totalHoursVal;
        closeKjkModal();
        loadOvertimeData();
      } else {
        showToast(res ? res.error : "Gagal menyimpan data KJK");
      }
    });
  }

  /* =========================================================
   * 1B. EXPORT EXCEL REKAP KJK KHUSUS ROLE PROJECT MANAGER
   * ========================================================= */

  function ensureXlsxLibrary(callback) {
    if (window.XLSX) {
      callback(true);
      return;
    }
    var script = document.createElement("script");
    script.src = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
    script.onload = function() { callback(true); };
    script.onerror = function() { callback(false); };
    document.head.appendChild(script);
  }

  function ensureZipLibrary(callback) {
    if (window.JSZip) {
      callback(true);
      return;
    }
    var script = document.createElement("script");
    script.src = "https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js";
    script.onload = function() { callback(true); };
    script.onerror = function() { callback(false); };
    document.head.appendChild(script);
  }

  function handleDownloadKjkExcel() {
    var siteSelect = document.getElementById("overtimeSiteFilter");
    var selectedSite = siteSelect ? siteSelect.value : "ALL";

    var periodFilter = document.getElementById("overtimePeriodFilter");
    var periodVal = periodFilter ? periodFilter.value : UtilitiesFormatDateMonth();
    var parts = periodVal.split("-");
    var monthNum = parseInt(parts[1], 10) || 9;

    var monthNamesEn = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
    var monthName = monthNamesEn[monthNum - 1] || "September";

    var btn = document.getElementById("btnDownloadKjkExcel");
    var originalHtml = btn ? btn.innerHTML : "";
    if (btn) {
      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin mr-1"></i> <span>Menyiapkan Excel...</span>';
    }

    showToast("Mengambil data KJK Site " + selectedSite + " periode " + monthName + "...");

    callBackend('getKjkExportData', [selectedSite, monthName], function(res) {
      if (btn) {
        btn.disabled = false;
        btn.innerHTML = originalHtml;
      }

      if (!res || !res.success) {
        showToast(res ? res.error : "Gagal mengambil data KJK untuk diekspor!");
        return;
      }

      var exportData = res.data || [];
      if (exportData.length === 0) {
        showToast("Tidak ada data karyawan ditemukan untuk Site " + selectedSite);
        return;
      }

      var fileName = "hr.KJK " + (res.site || selectedSite) + " " + (res.month || monthName);

      ensureXlsxLibrary(function(loaded) {
        if (loaded && window.XLSX) {
          var aoaData = [["NIK", "Employee", "Amount"]];
          exportData.forEach(function(item) {
            aoaData.push([
              item.nik || "-",
              String(item.employee || "").toUpperCase(),
              (item.amount !== undefined) ? item.amount : 0
            ]);
          });

          var ws = XLSX.utils.aoa_to_sheet(aoaData);
          ws['!cols'] = [{ wch: 18 }, { wch: 32 }, { wch: 14 }];
          var wb = XLSX.utils.book_new();
          XLSX.utils.book_append_sheet(wb, ws, "KJK");
          XLSX.writeFile(wb, fileName + ".xlsx");
          showToast("Berkas " + fileName + ".xlsx berhasil diunduh!");
        } else {
          var csvContent = "NIK,Employee,Amount\n";
          exportData.forEach(function(item) {
            var cleanName = String(item.employee || "").toUpperCase().replace(/"/g, '""');
            csvContent += '"' + (item.nik || "-") + '","' + cleanName + '",' + (item.amount || 0) + "\n";
          });
          var blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
          var link = document.createElement("a");
          var url = URL.createObjectURL(blob);
          link.setAttribute("href", url);
          link.setAttribute("download", fileName + ".csv");
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
          showToast("Berkas " + fileName + ".csv berhasil diunduh!");
        }
      });
    });
  }

  /* =========================================================
   * 1C. MODAL & EXPORT HR.OVERTIME (EXCEL/ZIP PER KARYAWAN)
   * ========================================================= */

  function openDownloadOvertimeModal() {
    var modal = document.getElementById("downloadOvertimeModal");
    if (!modal) return;

    var chkAllSites = document.getElementById("chkAllSites");
    if (chkAllSites) chkAllSites.checked = true;

    var siteCheckboxes = document.querySelectorAll(".site-chk");
    siteCheckboxes.forEach(function(chk) { chk.checked = true; });

    if (overtimeMasterEmployees.length === 0) {
      var listContainer = document.getElementById("downloadOvertimeEmployeeList");
      if (listContainer) {
        listContainer.innerHTML = '<p class="text-slate-400 text-center py-4"><i class="fa-solid fa-circle-notch fa-spin mr-1"></i> Memuat data master karyawan...</p>';
      }
      callBackend('getEmployeesList', [], function(empRes) {
        if (empRes && empRes.success) {
          overtimeMasterEmployees = empRes.data || [];
          renderDownloadOvertimeEmployees();
        } else {
          if (listContainer) listContainer.innerHTML = '<p class="text-rose-500 text-center py-4">Gagal memuat karyawan.</p>';
        }
      });
    } else {
      renderDownloadOvertimeEmployees();
    }

    modal.classList.remove("hidden");
  }

  function closeDownloadOvertimeModal() {
    var modal = document.getElementById("downloadOvertimeModal");
    if (modal) modal.classList.add("hidden");
  }

  function toggleAllSites(source) {
    var isChecked = source.checked;
    var siteCheckboxes = document.querySelectorAll(".site-chk");
    siteCheckboxes.forEach(function(chk) {
      chk.checked = isChecked;
    });
    renderDownloadOvertimeEmployees();
  }

  function handleSiteCheckboxChange() {
    var siteCheckboxes = Array.from(document.querySelectorAll(".site-chk"));
    var allChecked = siteCheckboxes.length > 0 && siteCheckboxes.every(function(chk) { return chk.checked; });
    var chkAllSites = document.getElementById("chkAllSites");
    if (chkAllSites) chkAllSites.checked = allChecked;

    renderDownloadOvertimeEmployees();
  }

  function getSelectedSitesFromModal() {
    var selected = [];
    var siteCheckboxes = document.querySelectorAll(".site-chk:checked");
    siteCheckboxes.forEach(function(chk) {
      selected.push(chk.value);
    });
    return selected;
  }

  function renderDownloadOvertimeEmployees() {
    var listContainer = document.getElementById("downloadOvertimeEmployeeList");
    if (!listContainer) return;

    var selectedSites = getSelectedSitesFromModal();
    var filteredEmployees = overtimeMasterEmployees.filter(function(emp) {
      return selectedSites.indexOf(emp.site) !== -1;
    });

    if (filteredEmployees.length === 0) {
      listContainer.innerHTML = '<p class="text-slate-400 text-center py-4">Tidak ada karyawan pada site yang dipilih.</p>';
      updateDownloadOvertimeSelectedCount();
      return;
    }

    var html = '';
    filteredEmployees.forEach(function(emp) {
      html += '<label class="flex items-center justify-between p-2 rounded-lg hover:bg-white transition cursor-pointer border border-transparent hover:border-slate-200">' +
        '<div class="flex items-center space-x-2">' +
        '  <input type="checkbox" class="download-emp-chk rounded text-[#1C1B8E] focus:ring-0" value="' + emp.user_id + '" data-name="' + (emp.nama_lengkap || '') + '" data-nik="' + (emp.nik || '-') + '" data-site="' + (emp.site || '') + '" onchange="handleEmployeeCheckboxChange()" checked>' +
        '  <span class="font-bold text-slate-800">' + emp.nama_lengkap + '</span>' +
        '</div>' +
        '<span class="text-[10px] bg-slate-200 text-slate-700 px-2 py-0.5 rounded font-bold">' + emp.site + '</span>' +
        '</label>';
    });

    listContainer.innerHTML = html;

    var chkAllEmployees = document.getElementById("chkAllEmployees");
    if (chkAllEmployees) chkAllEmployees.checked = true;

    updateDownloadOvertimeSelectedCount();
  }

  function toggleAllEmployees(source) {
    var isChecked = source.checked;
    var empCheckboxes = document.querySelectorAll(".download-emp-chk");
    empCheckboxes.forEach(function(chk) {
      chk.checked = isChecked;
    });
    updateDownloadOvertimeSelectedCount();
  }

  function handleEmployeeCheckboxChange() {
    var empCheckboxes = Array.from(document.querySelectorAll(".download-emp-chk"));
    var allChecked = empCheckboxes.length > 0 && empCheckboxes.every(function(chk) { return chk.checked; });
    var chkAllEmployees = document.getElementById("chkAllEmployees");
    if (chkAllEmployees) chkAllEmployees.checked = allChecked;

    updateDownloadOvertimeSelectedCount();
  }

  function updateDownloadOvertimeSelectedCount() {
    var countEl = document.getElementById("downloadOvertimeSelectedCount");
    var checkedBoxes = document.querySelectorAll(".download-emp-chk:checked");
    if (countEl) {
      countEl.innerText = checkedBoxes.length + " Karyawan terpilih";
    }
  }

  function formatOvertimeDateTime(dateStr, timeStr) {
    if (!dateStr) return "-";
    var timeParts = String(timeStr || "00:00").split(":");
    var hh = ("0" + (parseInt(timeParts[0], 10) || 0)).slice(-2);
    var mm = ("0" + (parseInt(timeParts[1], 10) || 0)).slice(-2);
    var ss = ("0" + (parseInt(timeParts[2], 10) || 0)).slice(-2);
    return dateStr + " " + hh + "." + mm + "." + ss;
  }

  function getNextDateString(dateStr) {
    if (!dateStr) return "";
    var parts = dateStr.split("-");
    if (parts.length === 3) {
      var d = new Date(parseInt(parts[0], 10), parseInt(parts[1], 10) - 1, parseInt(parts[2], 10));
      d.setDate(d.getDate() + 1);
      var y = d.getFullYear();
      var m = ("0" + (d.getMonth() + 1)).slice(-2);
      var day = ("0" + d.getDate()).slice(-2);
      return y + "-" + m + "-" + day;
    }
    return dateStr;
  }

  function executeDownloadHrOvertime() {
    var checkedBoxes = Array.from(document.querySelectorAll(".download-emp-chk:checked"));
    if (checkedBoxes.length === 0) {
      showToast("Harap pilih minimal 1 karyawan untuk diunduh!");
      return;
    }

    var periodFilter = document.getElementById("overtimePeriodFilter");
    var periodVal = periodFilter ? periodFilter.value : UtilitiesFormatDateMonth();

    var btn = document.getElementById("btnExecuteDownloadOvertime");
    var originalHtml = btn ? btn.innerHTML : "";
    if (btn) {
      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin mr-1.5"></i> <span>Memproses Excel...</span>';
    }

    showToast("Mengumpulkan data lembur Approved untuk periode " + periodVal + "...");

    callBackend('getOvertimeData', ['ALL', periodVal], function(res) {
      if (!res || !res.success) {
        if (btn) {
          btn.disabled = false;
          btn.innerHTML = originalHtml;
        }
        showToast(res ? res.error : "Gagal mengambil data lembur.");
        return;
      }

      var rawOvertime = res.data || [];
      var approvedOvertime = rawOvertime.filter(function(item) {
        return item.status_approval === 'Approved';
      });

      var approvedByUser = {};
      approvedOvertime.forEach(function(item) {
        if (!approvedByUser[item.user_id]) {
          approvedByUser[item.user_id] = [];
        }
        approvedByUser[item.user_id].push(item);
      });

      var employeesToExport = [];
      checkedBoxes.forEach(function(chk) {
        var uid = chk.value;
        var empName = chk.getAttribute("data-name") || "KARYAWAN";
        var empNik = chk.getAttribute("data-nik") || "-";
        var userRecords = approvedByUser[uid] || [];

        if (userRecords.length > 0) {
          employeesToExport.push({
            user_id: uid,
            name: empName,
            nik: empNik,
            records: userRecords
          });
        }
      });

      if (employeesToExport.length === 0) {
        if (btn) {
          btn.disabled = false;
          btn.innerHTML = originalHtml;
        }
        showToast("Tidak ada data lembur Approved untuk karyawan yang dipilih pada periode ini.");
        return;
      }

      ensureXlsxLibrary(function(xlsxLoaded) {
        if (!xlsxLoaded || !window.XLSX) {
          if (btn) {
            btn.disabled = false;
            btn.innerHTML = originalHtml;
          }
          showToast("Gagal memuat library Excel Spreadsheet.");
          return;
        }

        if (employeesToExport.length === 1) {
          var singleEmp = employeesToExport[0];
          var singleFileName = "hr.Overtime " + String(singleEmp.name).toUpperCase().trim();

          var aoa = [["NRP", "Employee", "Date from", "Date to"]];
          singleEmp.records.forEach(function(rec) {
            var dateFrom = formatOvertimeDateTime(rec.tanggal, rec.jam_mulai);
            var toDateStr = rec.tanggal;
            if (rec.jam_mulai && rec.jam_selesai && rec.jam_selesai < rec.jam_mulai) {
              toDateStr = getNextDateString(rec.tanggal);
            }
            var dateTo = formatOvertimeDateTime(toDateStr, rec.jam_selesai);

            aoa.push([
              rec.nik || singleEmp.nik || "-",
              String(singleEmp.name).toUpperCase().trim(),
              dateFrom,
              dateTo
            ]);
          });

          var ws = XLSX.utils.aoa_to_sheet(aoa);
          ws['!cols'] = [{ wch: 18 }, { wch: 32 }, { wch: 24 }, { wch: 24 }];
          var wb = XLSX.utils.book_new();
          XLSX.utils.book_append_sheet(wb, ws, "Overtime");

          XLSX.writeFile(wb, singleFileName + ".xlsx");

          if (btn) {
            btn.disabled = false;
            btn.innerHTML = originalHtml;
          }
          closeDownloadOvertimeModal();
          showToast("Berkas " + singleFileName + ".xlsx berhasil diunduh!");
        } else {
          ensureZipLibrary(function(zipLoaded) {
            if (!zipLoaded || !window.JSZip) {
              if (btn) {
                btn.disabled = false;
                btn.innerHTML = originalHtml;
              }
              showToast("Gagal memuat library pengemasan ZIP.");
              return;
            }

            var zip = new JSZip();

            employeesToExport.forEach(function(empItem) {
              var empFileName = "hr.Overtime " + String(empItem.name).toUpperCase().trim() + ".xlsx";

              var aoa = [["NRP", "Employee", "Date from", "Date to"]];
              empItem.records.forEach(function(rec) {
                var dateFrom = formatOvertimeDateTime(rec.tanggal, rec.jam_mulai);
                var toDateStr = rec.tanggal;
                if (rec.jam_mulai && rec.jam_selesai && rec.jam_selesai < rec.jam_mulai) {
                  toDateStr = getNextDateString(rec.tanggal);
                }
                var dateTo = formatOvertimeDateTime(toDateStr, rec.jam_selesai);

                aoa.push([
                  rec.nik || empItem.nik || "-",
                  String(empItem.name).toUpperCase().trim(),
                  dateFrom,
                  dateTo
                ]);
              });

              var ws = XLSX.utils.aoa_to_sheet(aoa);
              ws['!cols'] = [{ wch: 18 }, { wch: 32 }, { wch: 24 }, { wch: 24 }];
              var wb = XLSX.utils.book_new();
              XLSX.utils.book_append_sheet(wb, ws, "Overtime");

              var wbout = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
              zip.file(empFileName, wbout);
            });

            zip.generateAsync({ type: "blob" }).then(function(zipBlob) {
              var zipFileName = "hr.Overtime (" + employeesToExport.length + " Karyawan) " + periodVal + ".zip";
              var link = document.createElement("a");
              link.href = URL.createObjectURL(zipBlob);
              link.download = zipFileName;
              document.body.appendChild(link);
              link.click();
              document.body.removeChild(link);

              if (btn) {
                btn.disabled = false;
                btn.innerHTML = originalHtml;
              }
              closeDownloadOvertimeModal();
              showToast(employeesToExport.length + " berkas Excel berhasil dikemas & diunduh (.zip)!");
            });
          });
        }
      });
    });
  }

  /* =========================================================
   * 2. PENGHITUNG JAM & MANAJEMEN LEMBUR (MULTI-FILTER PM)
   * ========================================================= */

  function calculateOvertimeHours() {
    var startVal = document.getElementById("ovtStart").value;
    var finishVal = document.getElementById("ovtFinish").value;
    var displayEl = document.getElementById("ovtTotalHoursDisplay");
    var hiddenInput = document.getElementById("ovtTotalHoursInput");

    if (!startVal || !finishVal) {
      if (displayEl) displayEl.innerText = "0 Jam";
      if (hiddenInput) hiddenInput.value = "0";
      return;
    }

    var start = new Date("1970-01-01T" + startVal + ":00");
    var finish = new Date("1970-01-01T" + finishVal + ":00");

    var diffMs = finish - start;
    if (diffMs < 0) {
      diffMs += 24 * 60 * 60 * 1000;
    }

    var diffHours = diffMs / (1000 * 60 * 60);
    diffHours = Math.round(diffHours * 10) / 10;

    if (displayEl) displayEl.innerText = diffHours + " Jam";
    if (hiddenInput) hiddenInput.value = diffHours;
  }

  function loadOvertimeData() {
    var isKaryawan = (currentUser && currentUser.role === 'Karyawan');
    var userId = isKaryawan ? currentUser.user_id : 'ALL';
    var periodFilter = document.getElementById("overtimePeriodFilter");
    var period = periodFilter ? periodFilter.value : UtilitiesFormatDateMonth();

    // Kontrol visibilitas tombol aksi berdasarkan role
    var karyawanButtons = document.querySelectorAll(".role-karyawan");
    karyawanButtons.forEach(function(el) {
      if (isKaryawan) el.classList.remove("hidden");
      else el.classList.add("hidden");
    });

    var pmButtons = document.querySelectorAll(".role-pm");
    pmButtons.forEach(function(el) {
      if (!isKaryawan) el.classList.remove("hidden");
      else el.classList.add("hidden");
    });

    // Kontrol Subtab KJK di pojok kanan kartu (hanya untuk PM / Admin)
    var subtabKjkBtn = document.getElementById("subtabKjkBtn");
    if (subtabKjkBtn) {
      if (!isKaryawan) subtabKjkBtn.classList.remove("hidden");
      else subtabKjkBtn.classList.add("hidden");
    }

    // PENGATURAN LEBAR LAYOUT AGAR TABEL FULL-WIDTH UNTUK PM
    var formCol = document.getElementById("ovtFormContainer");
    var tableCol = document.getElementById("ovtTableContainer");

    if (isKaryawan) {
      if (formCol) formCol.classList.remove("hidden");
      if (tableCol) {
        tableCol.classList.remove("lg:col-span-3", "col-span-full");
        tableCol.classList.add("lg:col-span-2");
      }
    } else {
      if (formCol) formCol.classList.add("hidden");
      if (tableCol) {
        tableCol.classList.remove("lg:col-span-2");
        tableCol.classList.add("lg:col-span-3", "col-span-full");
      }
    }

    if (!isKaryawan && overtimeMasterEmployees.length === 0) {
      callBackend('getEmployeesList', [], function(empRes) {
        if (empRes && empRes.success) {
          overtimeMasterEmployees = empRes.data || [];
          populatePmEmployeeDropdown("ALL");
        }
      });
    }

    callBackend('getOvertimeData', [userId, period], function(res) {
      if (res && res.success) {
        currentOvertimeCache = res.data || [];
        if (res.kjkMap) currentKjkMap = res.kjkMap;
        if (res.attendanceMap) {
          currentAttendanceMap = res.attendanceMap;
          updateAttendanceBadgeUI(isKaryawan ? currentUser.user_id : "");
        }

        if (!isKaryawan && overtimeMasterEmployees.length === 0 && currentOvertimeCache.length > 0) {
          var uniqueEmps = {};
          currentOvertimeCache.forEach(function(item) {
            if (item.user_id && !uniqueEmps[item.user_id]) {
              uniqueEmps[item.user_id] = {
                user_id: item.user_id,
                nama_lengkap: item.nama_lengkap,
                site: item.site || "CGK1",
                nik: item.nik || "-",
                departemen: item.departemen || "Operations"
              };
            }
          });
          overtimeMasterEmployees = Object.values(uniqueEmps);
          populatePmEmployeeDropdown(document.getElementById("overtimeSiteFilter") ? document.getElementById("overtimeSiteFilter").value : "ALL");
        }

        applyOvertimeFilters();
      }
    });
  }

  function populatePmEmployeeDropdown(selectedSite) {
    var empSelect = document.getElementById("overtimeEmployeeFilter");
    if (!empSelect) return;

    var currentVal = empSelect.value || "ALL";
    empSelect.innerHTML = '<option value="ALL">Semua Karyawan</option>';

    var filtered = overtimeMasterEmployees;
    if (selectedSite && selectedSite !== "ALL") {
      filtered = overtimeMasterEmployees.filter(function(emp) {
        return (emp.site === selectedSite);
      });
    }

    filtered.forEach(function(emp) {
      var opt = document.createElement("option");
      opt.value = emp.user_id;
      opt.innerText = emp.nama_lengkap + " (" + (emp.site || 'Site') + ")";
      empSelect.appendChild(opt);
    });

    var stillExists = Array.from(empSelect.options).some(function(o) { return o.value === currentVal; });
    empSelect.value = stillExists ? currentVal : "ALL";
  }

  function handleOvertimeSiteChange() {
    var siteVal = document.getElementById("overtimeSiteFilter").value;
    populatePmEmployeeDropdown(siteVal);
    applyOvertimeFilters();
  }

  function handleOvertimeEmployeeChange() {
    applyOvertimeFilters();
  }

  function applyOvertimeFilters() {
    var isKaryawan = (currentUser && currentUser.role === 'Karyawan');
    
    if (isKaryawan) {
      currentFilteredOvertimeCache = currentOvertimeCache.slice();
    } else {
      var siteVal = document.getElementById("overtimeSiteFilter") ? document.getElementById("overtimeSiteFilter").value : "ALL";
      var empVal = document.getElementById("overtimeEmployeeFilter") ? document.getElementById("overtimeEmployeeFilter").value : "ALL";

      currentFilteredOvertimeCache = currentOvertimeCache.filter(function(item) {
        var matchSite = (siteVal === "ALL" || item.site === siteVal);
        var matchEmp = (empVal === "ALL" || item.user_id === empVal);
        return matchSite && matchEmp;
      });
    }

    // Kalkulasi Total Akumulasi Lembur
    var totalHrs = 0;
    currentFilteredOvertimeCache.forEach(function(item) {
      totalHrs += (parseFloat(item.total_jam) || 0);
    });
    totalHrs = Math.round(totalHrs * 10) / 10;

    // Kalkulasi Total KJK tersinkronisasi dinamis dengan filter Periode, Site & Karyawan
    var periodFilter = document.getElementById("overtimePeriodFilter");
    var periodVal = periodFilter ? periodFilter.value : UtilitiesFormatDateMonth();
    var parts = periodVal.split("-");
    var monthNum = parseInt(parts[1], 10) || 9;
    var monthNamesEn = ["january", "february", "march", "april", "may", "june", "july", "august", "september", "october", "november", "december"];
    var monthKey = monthNamesEn[monthNum - 1] || "september";

    var totalKjkSum = 0;
    var targetUsersForKjk = [];

    if (isKaryawan) {
      targetUsersForKjk = [currentUser ? currentUser.user_id : 'USR-0003'];
    } else {
      var siteVal2 = document.getElementById("overtimeSiteFilter") ? document.getElementById("overtimeSiteFilter").value : "ALL";
      var empVal2 = document.getElementById("overtimeEmployeeFilter") ? document.getElementById("overtimeEmployeeFilter").value : "ALL";

      if (overtimeMasterEmployees && overtimeMasterEmployees.length > 0) {
        overtimeMasterEmployees.forEach(function(emp) {
          var matchSite = (siteVal2 === "ALL" || emp.site === siteVal2);
          var matchEmp = (empVal2 === "ALL" || emp.user_id === empVal2);
          if (matchSite && matchEmp) {
            targetUsersForKjk.push(emp.user_id);
          }
        });
      } else {
        var seen = {};
        currentOvertimeCache.forEach(function(item) {
          var matchSite = (siteVal2 === "ALL" || item.site === siteVal2);
          var matchEmp = (empVal2 === "ALL" || item.user_id === empVal2);
          if (matchSite && matchEmp && item.user_id && !seen[item.user_id]) {
            seen[item.user_id] = true;
            targetUsersForKjk.push(item.user_id);
          }
        });
      }
    }

    targetUsersForKjk.forEach(function(uid) {
      var mapKey = uid + "_" + monthKey;
      if (currentKjkMap && currentKjkMap[mapKey] !== undefined) {
        totalKjkSum += (parseFloat(currentKjkMap[mapKey]) || 0);
      }
    });
    totalKjkSum = Math.round(totalKjkSum * 10) / 10;

    // Perbarui Tampilan Badge Angka Jam di Toolbar & Card Header
    var totalKjkEl = document.getElementById("ovtTotalKjkToolbar");
    if (totalKjkEl) totalKjkEl.innerText = totalKjkSum + " Jam";

    var cardKjkEl = document.getElementById("ovtCardKjkHours");
    if (cardKjkEl) cardKjkEl.innerText = totalKjkSum + " Jam";

    var totalHoursEl = document.getElementById("ovtTotalMonthHours");
    if (totalHoursEl) totalHoursEl.innerText = totalHrs + " Jam";

    var toolbarHoursEl = document.getElementById("ovtTotalMonthHoursToolbar");
    if (toolbarHoursEl) toolbarHoursEl.innerText = totalHrs + " Jam";

    // Reset Paginasi ke Halaman 1 saat Filter Berubah
    currentOvtPage = 1;
    currentKjkPage = 1;

    // Render tabel aktif sesuai sub-tab terpilih
    if (currentOvertimeSubTab === 'kjk') {
      renderKjkTable();
    } else {
      renderOvertimeTable(currentFilteredOvertimeCache);
    }
  }

  /* =========================================================
   * 2B. SUB-MENU TABS SWITCHER (TOTAL AKUMULASI vs TOTAL KJK)
   * ========================================================= */

  function switchOvertimeSubTab(targetTab) {
    currentOvertimeSubTab = targetTab;

    var subtabKjkBtn = document.getElementById("subtabKjkBtn");
    var subtabOvtBtn = document.getElementById("subtabOvtBtn");
    var subtabKjkLabel = document.getElementById("subtabKjkLabel");
    var subtabOvtLabel = document.getElementById("subtabOvtLabel");
    var cardKjkVal = document.getElementById("ovtCardKjkHours");
    var cardOvtVal = document.getElementById("ovtTotalMonthHours");

    var ovtWrapper = document.getElementById("ovtTableWrapper");
    var kjkWrapper = document.getElementById("kjkTableWrapper");
    var cardTitle = document.getElementById("ovtTableCardTitle");
    var cardSubtitle = document.getElementById("ovtTableCardSubtitle");

    if (targetTab === 'kjk') {
      // 1. Ubah Gaya Tab KJK menjadi Aktif (Highlight Amber)
      if (subtabKjkBtn) {
        subtabKjkBtn.className = "p-2 px-3.5 rounded-xl border-2 border-amber-500 bg-amber-50 text-right transition cursor-pointer shadow-xs";
      }
      if (subtabKjkLabel) subtabKjkLabel.className = "text-[10px] font-bold uppercase tracking-wider text-amber-800";
      if (cardKjkVal) cardKjkVal.className = "text-base font-extrabold text-amber-900";

      // 2. Ubah Gaya Tab Lembur menjadi Tidak Aktif
      if (subtabOvtBtn) {
        subtabOvtBtn.className = "p-2 px-3.5 rounded-xl border border-slate-200 bg-white hover:bg-indigo-50 text-right transition cursor-pointer group shadow-xs";
      }
      if (subtabOvtLabel) subtabOvtLabel.className = "text-[10px] font-bold uppercase tracking-wider text-slate-500 group-hover:text-[#1C1B8E]";
      if (cardOvtVal) cardOvtVal.className = "text-base font-extrabold text-slate-700 group-hover:text-[#1C1B8E]";

      // 3. Tampilkan Tabel KJK & Sembunyikan Tabel Lembur
      if (ovtWrapper) ovtWrapper.classList.add("hidden");
      if (kjkWrapper) kjkWrapper.classList.remove("hidden");

      if (cardTitle) cardTitle.innerText = "Rekapitulasi Kelebihan Jam Kerja (KJK) Karyawan";
      if (cardSubtitle) cardSubtitle.innerText = "Daftar karyawan dan total jam KJK yang tercatat pada periode terpilih";

      currentKjkPage = 1;
      renderKjkTable();

    } else {
      // 1. Ubah Gaya Tab Lembur menjadi Aktif (Highlight Biru KSPS)
      if (subtabOvtBtn) {
        subtabOvtBtn.className = "p-2 px-3.5 rounded-xl border-2 border-[#1C1B8E] bg-indigo-50 text-right transition cursor-pointer shadow-xs";
      }
      if (subtabOvtLabel) subtabOvtLabel.className = "text-[10px] font-bold uppercase tracking-wider text-[#1C1B8E]";
      if (cardOvtVal) cardOvtVal.className = "text-base font-extrabold text-[#1C1B8E]";

      // 2. Ubah Gaya Tab KJK menjadi Tidak Aktif
      if (subtabKjkBtn) {
        subtabKjkBtn.className = "p-2 px-3.5 rounded-xl border border-slate-200 bg-white hover:bg-amber-50 text-right transition cursor-pointer group shadow-xs";
      }
      if (subtabKjkLabel) subtabKjkLabel.className = "text-[10px] font-bold uppercase tracking-wider text-slate-500 group-hover:text-amber-700";
      if (cardKjkVal) cardKjkVal.className = "text-base font-extrabold text-slate-700 group-hover:text-amber-800";

      // 3. Tampilkan Tabel Lembur & Sembunyikan Tabel KJK
      if (kjkWrapper) kjkWrapper.classList.add("hidden");
      if (ovtWrapper) ovtWrapper.classList.remove("hidden");

      if (cardTitle) cardTitle.innerText = "Riwayat & Akumulasi Lembur Bulanan";
      if (cardSubtitle) cardSubtitle.innerText = "Daftar rincian lembur, status persetujuan, dan tindakan revisi";

      currentOvtPage = 1;
      renderOvertimeTable(currentFilteredOvertimeCache);
    }
  }

  function UtilitiesFormatDateMonth() {
    var d = new Date();
    var month = '' + (d.getMonth() + 1);
    var year = d.getFullYear();
    if (month.length < 2) month = '0' + month;
    return year + '-' + month;
  }

  function getOvertimeItem(idx) {
    if (currentFilteredOvertimeCache && currentFilteredOvertimeCache[idx]) {
      return currentFilteredOvertimeCache[idx];
    }
    return currentOvertimeCache[idx];
  }

  /* =========================================================
   * 3. RENDER TABEL LEMBUR DENGAN PAGINASI (10 ITEM PER HALAMAN)
   * ========================================================= */

  function renderOvertimeTable(list) {
    var tbody = document.getElementById("overtimeTableBody");
    if (!tbody) return;
    tbody.innerHTML = "";

    var isPmOrAdmin = currentUser && (currentUser.role === 'Project Manager' || currentUser.role === 'Super Admin');

    if (!list || list.length === 0) {
      tbody.innerHTML = '<tr><td colspan="8" class="text-center text-slate-500 text-sm py-8">Belum ada data lembur untuk kriteria filter periode ini.</td></tr>';
      renderOvertimePaginationControls(0, 1);
      return;
    }

    var totalItems = list.length;
    var totalPages = Math.ceil(totalItems / ovtItemsPerPage) || 1;
    if (currentOvtPage > totalPages) currentOvtPage = totalPages;
    if (currentOvtPage < 1) currentOvtPage = 1;

    var startIndex = (currentOvtPage - 1) * ovtItemsPerPage;
    var endIndex = Math.min(startIndex + ovtItemsPerPage, totalItems);
    var pageList = list.slice(startIndex, endIndex);

    pageList.forEach(function(item, pageIdx) {
      var idx = startIndex + pageIdx;
      var tr = document.createElement("tr");
      tr.className = "hover:bg-slate-50 transition border-b border-slate-100";

      var statusBadge = '<span class="bg-amber-50 text-amber-700 px-2.5 py-1 rounded-full text-[11px] font-bold border border-amber-200">Pending</span>';
      if (item.status_approval === 'Approved') {
        statusBadge = '<span class="bg-emerald-50 text-emerald-600 px-2.5 py-1 rounded-full text-[11px] font-bold border border-emerald-200"><i class="fa-solid fa-check mr-1"></i>Approved</span>';
      } else if (item.status_approval === 'Perlu Revisi') {
        statusBadge = '<span class="bg-rose-50 text-rose-600 px-2.5 py-1 rounded-full text-[11px] font-bold border border-rose-200"><i class="fa-solid fa-rotate-left mr-1"></i>Perlu Revisi</span>';
      } else if (item.status_approval === 'Rejected') {
        statusBadge = '<span class="bg-slate-100 text-slate-600 px-2.5 py-1 rounded-full text-[11px] font-bold border border-slate-300">Rejected</span>';
      }

      var printSingleBtn = '<button type="button" onclick="printSuratTugasPDF(' + idx + ')" class="px-2.5 py-1 rounded-lg bg-indigo-50 hover:bg-indigo-100 text-[#1C1B8E] text-[11px] font-bold transition flex items-center justify-center space-x-1 mx-auto border border-indigo-100">' +
        '<i class="fa-solid fa-file-lines"></i><span>Surat Tugas</span>' +
        '</button>';

      var empNameSub = (isPmOrAdmin && item.nama_lengkap) ?
        '<p class="text-[10px] text-indigo-700 font-bold mb-0.5"><i class="fa-solid fa-user mr-1"></i>' + item.nama_lengkap + ' (' + (item.site || 'Site') + ')</p>' : '';

      var descHtml = '<div>' + empNameSub + '<p class="font-medium text-slate-800">' + item.deskripsi + '</p>';
      if (item.catatan && item.catatan !== '-') {
        descHtml += '<p class="text-[11px] text-slate-500 mt-0.5"><span class="font-semibold">Note:</span> ' + item.catatan + '</p>';
      }
      if (item.status_approval === 'Perlu Revisi' && item.catatan_revisi) {
        descHtml += '<div class="mt-2 p-2 rounded-lg bg-rose-50 border border-rose-200 text-rose-800 text-[11px]">' +
          '<span class="font-bold flex items-center"><i class="fa-solid fa-triangle-exclamation text-rose-600 mr-1"></i> Catatan Revisi PM:</span>' +
          '<p class="mt-0.5 text-rose-900">' + item.catatan_revisi + '</p>' +
          '</div>';
      }
      descHtml += '</div>';

      var actionsHtml = '<span class="text-slate-400 text-[11px]">-</span>';

      if (isPmOrAdmin) {
        var btnDelete = '<button type="button" onclick="openDeleteOvertimeModal(' + idx + ')" class="w-7 h-7 rounded-lg bg-rose-50 hover:bg-rose-100 text-rose-600 flex items-center justify-center transition border border-rose-200 shadow-xs" title="Hapus Lembur Tanggal Ini">' +
          '<i class="fa-solid fa-trash-can text-xs"></i></button>';

        if (item.status_approval === 'Pending' || item.status_approval === 'Perlu Revisi') {
          actionsHtml = '<div class="flex items-center justify-center space-x-1.5">' +
            '<button type="button" onclick="handlePmApprove(' + idx + ')" class="px-2.5 py-1 rounded-lg bg-emerald-50 hover:bg-emerald-100 text-emerald-700 text-[11px] font-bold border border-emerald-200 transition" title="Setujui Lembur">' +
            '<i class="fa-solid fa-check mr-1"></i>Approve</button>' +
            '<button type="button" onclick="openPmRevisionModal(' + idx + ')" class="px-2.5 py-1 rounded-lg bg-amber-50 hover:bg-amber-100 text-amber-700 text-[11px] font-bold border border-amber-200 transition" title="Minta Revisi">' +
            '<i class="fa-solid fa-rotate-left mr-1"></i>Revisi</button>' +
            btnDelete +
            '</div>';
        } else if (item.status_approval === 'Approved') {
          actionsHtml = '<div class="flex items-center justify-center space-x-2">' +
            '<span class="text-[11px] font-bold text-emerald-600 flex items-center"><i class="fa-solid fa-circle-check mr-1"></i>' + (item.approved_by || 'Disetujui') + '</span>' +
            btnDelete +
            '</div>';
        } else {
          actionsHtml = '<div class="flex items-center justify-center space-x-1.5">' + btnDelete + '</div>';
        }
      } else {
        if (item.status_approval === 'Perlu Revisi') {
          actionsHtml = '<button type="button" onclick="startEditOvertime(' + idx + ')" class="px-3 py-1 rounded-lg bg-amber-500 hover:bg-amber-600 text-white text-[11px] font-bold shadow-sm transition flex items-center justify-center space-x-1 mx-auto">' +
            '<i class="fa-solid fa-pen-to-square"></i><span>Koreksi</span></button>';
        } else if (item.status_approval === 'Pending') {
          actionsHtml = '<button type="button" onclick="startEditOvertime(' + idx + ')" class="px-2.5 py-1 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 text-[11px] font-bold transition flex items-center justify-center space-x-1 mx-auto">' +

                     '<td class="py-3.5 px-3 text-center text-xs text-slate-700 font-semibold whitespace-nowrap">' + item.jam_mulai + ' - ' + item.jam_selesai + '</td>' +
                     '<td class="py-3.5 px-3 text-center font-extrabold text-xs text-[#1C1B8E] whitespace-nowrap">' + item.total_jam + ' Jam</td>' +
                     '<td class="py-3.5 px-3 text-xs max-w-sm">' + descHtml + '</td>' +
                     '<td class="py-3.5 px-3 text-center">' + printSingleBtn + '</td>' +
                     '<td class="py-3.5 px-3 text-center">' + statusBadge + '</td>' +
                     '<td class="py-3.5 px-3 text-center">' + actionsHtml + '</td>';

      tbody.appendChild(tr);
    });

    renderOvertimePaginationControls(totalItems, totalPages);
  }

  function renderOvertimePaginationControls(totalItems, totalPages) {
    var ctrl = document.getElementById("ovtPaginationControls");
    var info = document.getElementById("ovtPaginationInfo");
    if (!ctrl) return;
    ctrl.innerHTML = "";

    var startItem = totalItems === 0 ? 0 : (currentOvtPage - 1) * ovtItemsPerPage + 1;
    var endItem = Math.min(currentOvtPage * ovtItemsPerPage, totalItems);

    if (info) {
      if (totalItems === 0) {
        info.innerHTML = '<span class="text-slate-400">Tidak ada data lembur</span>';
      } else {
        info.innerHTML = '<span class="font-medium text-slate-600">Menampilkan <strong>' + startItem + ' - ' + endItem + '</strong> dari <strong>' + totalItems + '</strong> data lembur</span>';
      }
    }

    if (totalPages <= 1) return;

    // Tombol Previous
    var prevBtn = document.createElement("button");
    prevBtn.type = "button";
    prevBtn.innerHTML = '<i class="fa-solid fa-chevron-left text-[10px]"></i>';
    prevBtn.className = "w-7 h-7 rounded-lg text-xs font-bold transition flex items-center justify-center " + 
      (currentOvtPage === 1 ? "bg-slate-100 text-slate-300 cursor-not-allowed" : "bg-white hover:bg-indigo-50 border border-slate-200 text-slate-700 hover:text-[#1C1B8E]");
    prevBtn.disabled = (currentOvtPage === 1);
    prevBtn.onclick = function() {
      if (currentOvtPage > 1) {
        currentOvtPage--;
        renderOvertimeTable(currentFilteredOvertimeCache);
      }
    };
    ctrl.appendChild(prevBtn);

    // Tombol Nomor Halaman Dinamis
    for (var p = 1; p <= totalPages; p++) {
      var btn = document.createElement("button");
      btn.type = "button";
      btn.innerText = p;
      btn.className = "w-7 h-7 rounded-lg text-xs font-bold transition flex items-center justify-center " + 
        (p === currentOvtPage ? "bg-[#1C1B8E] text-white shadow-xs" : "bg-white hover:bg-slate-100 border border-slate-200 text-slate-700");
      (function(pageNumber) {
        btn.onclick = function() {
          currentOvtPage = pageNumber;
          renderOvertimeTable(currentFilteredOvertimeCache);
        };
      })(p);
      ctrl.appendChild(btn);
    }

    // Tombol Next
    var nextBtn = document.createElement("button");
    nextBtn.type = "button";
    nextBtn.innerHTML = '<i class="fa-solid fa-chevron-right text-[10px]"></i>';
    nextBtn.className = "w-7 h-7 rounded-lg text-xs font-bold transition flex items-center justify-center " + 
      (currentOvtPage === totalPages ? "bg-slate-100 text-slate-300 cursor-not-allowed" : "bg-white hover:bg-indigo-50 border border-slate-200 text-slate-700 hover:text-[#1C1B8E]");
    nextBtn.disabled = (currentOvtPage === totalPages);
    nextBtn.onclick = function() {
      if (currentOvtPage < totalPages) {
        currentOvtPage++;
        renderOvertimeTable(currentFilteredOvertimeCache);
      }
    };
    ctrl.appendChild(nextBtn);
  }

  /* =========================================================
   * 3B. RENDER TABEL REKAPITULASI KJK KARYAWAN (SUB-MENU KJK)
   * ========================================================= */

  function renderKjkTable() {
    var tbody = document.getElementById("kjkTableBody");
    if (!tbody) return;
    tbody.innerHTML = "";

    var periodFilter = document.getElementById("overtimePeriodFilter");
    var periodVal = periodFilter ? periodFilter.value : UtilitiesFormatDateMonth();
    var parts = periodVal.split("-");
    var monthNum = parseInt(parts[1], 10) || 9;
    var yearNum = parts[0] || "2026";
    var monthNamesIndo = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];
    var monthNamesEn = ["january", "february", "march", "april", "may", "june", "july", "august", "september", "october", "november", "december"];
    var monthIndoLabel = (monthNamesIndo[monthNum - 1] || "September") + " " + yearNum;
    var monthKey = monthNamesEn[monthNum - 1] || "september";

    var siteVal = document.getElementById("overtimeSiteFilter") ? document.getElementById("overtimeSiteFilter").value : "ALL";
    var empVal = document.getElementById("overtimeEmployeeFilter") ? document.getElementById("overtimeEmployeeFilter").value : "ALL";

    // 1. Kumpulkan daftar master karyawan yang sesuai dengan filter Site & Karyawan
    var baseEmployees = overtimeMasterEmployees.slice();
    if (baseEmployees.length === 0 && currentOvertimeCache.length > 0) {
      var seen = {};
      currentOvertimeCache.forEach(function(item) {
        if (item.user_id && !seen[item.user_id]) {
          seen[item.user_id] = true;
          baseEmployees.push({
            user_id: item.user_id,
            nama_lengkap: item.nama_lengkap,
            site: item.site || "CGK1",
            nik: item.nik || "-",
            departemen: item.departemen || "Operations"
          });
        }
      });
    }

    var filteredEmps = baseEmployees.filter(function(emp) {
      var matchSite = (siteVal === "ALL" || emp.site === siteVal);
      var matchEmp = (empVal === "ALL" || emp.user_id === empVal);
      return matchSite && matchEmp;
    });

    // 2. Filter akun karyawan yang memiliki data jam KJK pada periode ini
    var kjkList = [];
    filteredEmps.forEach(function(emp) {
      var mapKey = emp.user_id + "_" + monthKey;
      var kjkHours = (currentKjkMap && currentKjkMap[mapKey] !== undefined) ? (parseFloat(currentKjkMap[mapKey]) || 0) : 0;
      
      // Masukkan akun karyawan jika jam KJK > 0 atau jika sedang menyortir karyawan spesifik
      if (kjkHours > 0 || empVal !== "ALL") {
        kjkList.push({
          user_id: emp.user_id,
          nik: emp.nik || "-",
          nama_lengkap: emp.nama_lengkap || "-",
          site: emp.site || "CGK1",
          periode: monthIndoLabel,
          total_kjk: kjkHours
        });
      }
    });

    // Urutkan dari jam KJK terbanyak
    kjkList.sort(function(a, b) {
      return b.total_kjk - a.total_kjk;
    });

    var totalItems = kjkList.length;

    if (totalItems === 0) {
      tbody.innerHTML = '<tr><td colspan="7" class="text-center text-slate-500 text-sm py-8">Tidak ada akun karyawan yang memiliki catatan jam KJK untuk kriteria filter periode ini.</td></tr>';
      renderKjkPaginationControls(0, 1);
      return;
    }

    var totalPages = Math.ceil(totalItems / kjkItemsPerPage) || 1;
    if (currentKjkPage > totalPages) currentKjkPage = totalPages;
    if (currentKjkPage < 1) currentKjkPage = 1;

    var startIndex = (currentKjkPage - 1) * kjkItemsPerPage;
    var endIndex = Math.min(startIndex + kjkItemsPerPage, totalItems);
    var pageList = kjkList.slice(startIndex, endIndex);

    pageList.forEach(function(item, pageIdx) {
      var idx = startIndex + pageIdx;
      var tr = document.createElement("tr");
      tr.className = "hover:bg-amber-50/40 transition border-b border-slate-100";

      var statusKjkBadge = (item.total_kjk > 0) ?
        '<span class="bg-emerald-50 text-emerald-700 px-2.5 py-1 rounded-full text-[11px] font-bold border border-emerald-200 inline-flex items-center"><i class="fa-solid fa-circle-check mr-1 text-emerald-600"></i>Tercatat</span>' :
        '<span class="bg-slate-100 text-slate-500 px-2.5 py-1 rounded-full text-[11px] font-bold border border-slate-200">0 Jam</span>';

      tr.innerHTML = '<td class="py-3.5 px-3 text-center font-bold text-slate-500 text-xs">' + (idx + 1) + '</td>' +
                     '<td class="py-3.5 px-3 font-mono font-bold text-slate-800 text-xs">' + item.nik + '</td>' +
                     '<td class="py-3.5 px-3 font-bold text-slate-900 text-xs"><div class="flex items-center space-x-1.5"><i class="fa-solid fa-user text-amber-600 text-[10px]"></i><span>' + item.nama_lengkap + '</span></div></td>' +
                     '<td class="py-3.5 px-3 text-center"><span class="bg-indigo-50 text-[#1C1B8E] px-2.5 py-0.5 rounded-full text-[11px] font-bold border border-indigo-100">' + item.site + '</span></td>' +
                     '<td class="py-3.5 px-3 text-center text-xs text-slate-600 font-semibold">' + item.periode + '</td>' +
                     '<td class="py-3.5 px-3 text-center font-extrabold text-sm text-amber-800 whitespace-nowrap"><span class="bg-amber-50 border border-amber-200 px-3 py-1 rounded-xl">' + item.total_kjk + ' Jam</span></td>' +
                     '<td class="py-3.5 px-3 text-center">' + statusKjkBadge + '</td>';

      tbody.appendChild(tr);
    });

    renderKjkPaginationControls(totalItems, totalPages);
  }

  function renderKjkPaginationControls(totalItems, totalPages) {
    var ctrl = document.getElementById("ovtPaginationControls");
    var info = document.getElementById("ovtPaginationInfo");
    if (!ctrl) return;
    ctrl.innerHTML = "";

    var startItem = totalItems === 0 ? 0 : (currentKjkPage - 1) * kjkItemsPerPage + 1;
    var endItem = Math.min(currentKjkPage * kjkItemsPerPage, totalItems);

    if (info) {
      if (totalItems === 0) {
        info.innerHTML = '<span class="text-slate-400">Tidak ada akun karyawan ber-KJK</span>';
      } else {
        info.innerHTML = '<span class="font-medium text-slate-600">Menampilkan <strong>' + startItem + ' - ' + endItem + '</strong> dari <strong>' + totalItems + '</strong> akun karyawan ber-KJK</span>';
      }
    }

    if (totalPages <= 1) return;

    // Tombol Previous
    var prevBtn = document.createElement("button");
    prevBtn.type = "button";
    prevBtn.innerHTML = '<i class="fa-solid fa-chevron-left text-[10px]"></i>';
    prevBtn.className = "w-7 h-7 rounded-lg text-xs font-bold transition flex items-center justify-center " + 
      (currentKjkPage === 1 ? "bg-slate-100 text-slate-300 cursor-not-allowed" : "bg-white hover:bg-amber-50 border border-slate-200 text-slate-700 hover:text-amber-800");
    prevBtn.disabled = (currentKjkPage === 1);
    prevBtn.onclick = function() {
      if (currentKjkPage > 1) {
        currentKjkPage--;
        renderKjkTable();
      }
    };
    ctrl.appendChild(prevBtn);

    // Tombol Angka Halaman
    for (var p = 1; p <= totalPages; p++) {
      var btn = document.createElement("button");
      btn.type = "button";
      btn.innerText = p;
      btn.className = "w-7 h-7 rounded-lg text-xs font-bold transition flex items-center justify-center " + 
        (p === currentKjkPage ? "bg-amber-600 text-white shadow-xs" : "bg-white hover:bg-slate-100 border border-slate-200 text-slate-700");
      (function(pageNumber) {
        btn.onclick = function() {
          currentKjkPage = pageNumber;
          renderKjkTable();
        };
      })(p);
      ctrl.appendChild(btn);
    }

    // Tombol Next
    var nextBtn = document.createElement("button");
    nextBtn.type = "button";
    nextBtn.innerHTML = '<i class="fa-solid fa-chevron-right text-[10px]"></i>';
    nextBtn.className = "w-7 h-7 rounded-lg text-xs font-bold transition flex items-center justify-center " + 
      (currentKjkPage === totalPages ? "bg-slate-100 text-slate-300 cursor-not-allowed" : "bg-white hover:bg-amber-50 border border-slate-200 text-slate-700 hover:text-amber-800");
    nextBtn.disabled = (currentKjkPage === totalPages);
    nextBtn.onclick = function() {
      if (currentKjkPage < totalPages) {
        currentKjkPage++;
        renderKjkTable();
      }
    };
    ctrl.appendChild(nextBtn);
  }

  /* =========================================================
   * 4. SIKLUS APPROVAL & REVISI PM
   * ========================================================= */

  function handlePmApprove(itemIndex) {
    var item = getOvertimeItem(itemIndex);
    if (!item) return;

    if (!currentUser.signature) {
      showToast("Anda belum memiliki Tanda Tangan Digital. Silakan buat TTD terlebih dahulu.");
      openSignatureModal();
      return;
    }

    var pmName = currentUser.name || "Budi PM Infrastructure";
    var pmSig = currentUser.signature;

    callBackend('approveOvertime', [item.overtime_id, currentUser.user_id, pmSig, pmName], function(res) {
      if (res && res.success) {
        showToast("Pengajuan lembur " + item.nama_lengkap + " (" + item.tanggal + ") disetujui & ditandatangani!");
        loadOvertimeData();
      } else {
        showToast(res ? res.error : "Gagal menyetujui lembur");
      }
    });
  }

  function openPmRevisionModal(itemIndex) {
    var item = getOvertimeItem(itemIndex);
    if (!item) return;

    document.getElementById("pmRevisionTargetId").value = item.overtime_id;
    document.getElementById("pmRevisionText").value = item.catatan_revisi || "";
    document.getElementById("pmRevisionModal").classList.remove("hidden");
  }

  function closePmRevisionModal() {
    document.getElementById("pmRevisionModal").classList.add("hidden");
  }

  function submitPmRevision() {
    var targetId = document.getElementById("pmRevisionTargetId").value;
    var revisionNote = document.getElementById("pmRevisionText").value.trim();

    if (!revisionNote) {
      showToast("Harap isi instruksi revisi yang perlu diperbaiki oleh karyawan!");
      return;
    }

    var btn = document.getElementById("btnSubmitPmRevision");
    btn.disabled = true;
    btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin mr-1"></i> Mengirim...';

    callBackend('requestOvertimeRevision', [targetId, revisionNote, currentUser.user_id], function(res) {
      btn.disabled = false;
      btn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> <span>Kirim Instruksi Revisi</span>';

      if (res && res.success) {
        showToast("Instruksi revisi berhasil dikirim ke karyawan!");
        closePmRevisionModal();
        loadOvertimeData();
      } else {
        showToast(res ? res.error : "Gagal mengirim revisi");
      }
    });
  }

  /* =========================================================
   * 4B. MODAL & EKSEKUSI HAPUS LEMBUR (KHUSUS PM)
   * ========================================================= */

  function openDeleteOvertimeModal(itemIndex) {
    var item = getOvertimeItem(itemIndex);
    if (!item) return;

    document.getElementById("deleteOvertimeTargetId").value = item.overtime_id;
    document.getElementById("deleteOvtEmpName").innerText = item.nama_lengkap || "-";
    document.getElementById("deleteOvtDate").innerText = item.tanggal || "-";
    document.getElementById("deleteOvtHours").innerText = (item.total_jam || "0") + " Jam (" + (item.jam_mulai || "") + " - " + (item.jam_selesai || "") + ")";
    document.getElementById("deleteOvtDesc").innerText = item.deskripsi || "-";

    var modal = document.getElementById("deleteOvertimeConfirmModal");
    if (modal) modal.classList.remove("hidden");
  }

  function closeDeleteOvertimeModal() {
    var modal = document.getElementById("deleteOvertimeConfirmModal");
    if (modal) modal.classList.add("hidden");
  }

  function executeDeleteOvertime() {
    var targetId = document.getElementById("deleteOvertimeTargetId").value;
    if (!targetId) return;

    var btn = document.getElementById("btnExecuteDeleteOvertime");
    var originalHtml = btn ? btn.innerHTML : "";
    if (btn) {
      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin mr-1"></i> Menghapus...';
    }

    var pmId = currentUser ? currentUser.user_id : 'USR-0002';
    callBackend('deleteOvertimeEntry', [targetId, pmId], function(res) {
      if (btn) {
        btn.disabled = false;
        btn.innerHTML = originalHtml;
      }

      if (res && res.success) {
        showToast(res.message || "Data lembur berhasil dihapus!");
        closeDeleteOvertimeModal();
        loadOvertimeData();
      } else {
        showToast(res ? res.error : "Gagal menghapus data lembur.");
      }
    });
  }

  /* =========================================================
   * 5. SIKLUS EDIT & KOREKSI OLEH KARYAWAN
   * ========================================================= */

  function startEditOvertime(itemIndex) {
    var item = getOvertimeItem(itemIndex);
    if (!item) return;

    document.getElementById("ovtEditId").value = item.overtime_id;
    document.getElementById("ovtDate").value = item.tanggal;
    document.getElementById("ovtStart").value = item.jam_mulai;
    document.getElementById("ovtFinish").value = item.jam_selesai;
    document.getElementById("ovtDesc").value = item.deskripsi;
    document.getElementById("ovtNotes").value = (item.catatan === '-' ? '' : item.catatan);

    calculateOvertimeHours();

    var banner = document.getElementById("ovtEditBanner");
    var noteEl = document.getElementById("ovtEditRevisionNote");
    if (banner && noteEl) {
      noteEl.innerHTML = item.catatan_revisi ? 
        '<strong>Catatan PM:</strong> ' + item.catatan_revisi : 
        'Silakan perbaiki data jam atau rincian pekerjaan Anda.';
      banner.classList.remove("hidden");
    }

    var btnText = document.getElementById("btnSubmitOvertimeText");
    if (btnText) btnText.innerText = "Perbarui & Ajukan Ulang";

    var title = document.getElementById("ovtFormTitle");
    if (title) title.innerText = "Koreksi Aktivitas Lembur";

    document.getElementById("ovtForm").scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  function cancelOvertimeEdit() {
    var form = document.getElementById("ovtForm");
    if (form) form.reset();

    document.getElementById("ovtEditId").value = "";
    document.getElementById("ovtTotalHoursDisplay").innerText = "0 Jam";
    document.getElementById("ovtTotalHoursInput").value = "0";

    var banner = document.getElementById("ovtEditBanner");
    if (banner) banner.classList.add("hidden");

    var btnText = document.getElementById("btnSubmitOvertimeText");
    if (btnText) btnText.innerText = "Simpan Lembur";

    var title = document.getElementById("ovtFormTitle");
    if (title) title.innerText = "Input Aktivitas Lembur";
  }

  async function handleSaveOvertime(e) {
    e.preventDefault();

    var editId = document.getElementById("ovtEditId").value;
    var dateVal = document.getElementById("ovtDate").value;
    var startVal = document.getElementById("ovtStart").value;
    var finishVal = document.getElementById("ovtFinish").value;
    var hoursVal = parseFloat(document.getElementById("ovtTotalHoursInput").value) || 0;
    var descVal = document.getElementById("ovtDesc").value;
    var noteVal = document.getElementById("ovtNotes").value;

    if (!dateVal || !startVal || !finishVal || hoursVal <= 0 || !descVal) {
      showToast("Harap lengkapi tanggal, jam mulai, jam selesai, dan deskripsi pekerjaan lembur!");
      return;
    }

    var data = {
      overtime_id: editId || "",
      user_id: currentUser ? currentUser.user_id : 'USR-0003',
      tanggal: dateVal,
      jam_mulai: startVal,
      jam_selesai: finishVal,
      total_jam: hoursVal,
      deskripsi: descVal,
      catatan: noteVal,
      user_signature: currentUser ? (currentUser.signature || "") : ""
    };

    var btn = document.getElementById("btnSubmitOvertime");
    if (btn) {
      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin mr-1"></i> Menyimpan...';
    }

    callBackend('saveOvertimeEntry', [data], function(res) {
      if (btn) {
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-floppy-disk mr-1"></i> <span id="btnSubmitOvertimeText">Simpan Lembur</span>';
      }

      if (res && res.success) {
        showToast(res.message || "Data lembur berhasil disimpan!");
        cancelOvertimeEdit();
        loadOvertimeData();
      } else {
        showToast(res ? res.error : "Gagal menyimpan lembur");
      }
    });
  }

  /* =========================================================
   * 6. UPLOAD, LIHAT & HAPUS 3 SLOT DOKUMEN PENDUKUNG (PDF)
   * ========================================================= */

  function openUploadAttendanceModal() {
    var modal = document.getElementById("uploadAttendanceModal");
    if (!modal) return;

    var uid = currentUser ? currentUser.user_id : 'USR-0003';
    var userSlots = (currentAttendanceMap && currentAttendanceMap[uid]) ? currentAttendanceMap[uid] : {};

    // Inisialisasi Slot 1 (Form Absensi Fix Wajib)
    var slot1Input = document.getElementById("attendancePdfInput_slot1");
    if (slot1Input) slot1Input.value = "";
    var slot1Box = document.getElementById("slot1FileInfoBox");
    var slot1Name = document.getElementById("slot1FileName");
    var slot1Link = document.getElementById("slot1ViewLink");

    if (userSlots["slot1"] && userSlots["slot1"].fileUrl && userSlots["slot1"].fileUrl !== "#") {
      if (slot1Name) slot1Name.innerText = userSlots["slot1"].fileName || "Form Absensi Terunggah";
      if (slot1Link) slot1Link.href = userSlots["slot1"].fileUrl;
      if (slot1Box) slot1Box.classList.remove("hidden");
    } else {
      if (slot1Box) slot1Box.classList.add("hidden");
    }

    // Inisialisasi Slot 2 (Dokumen Pendukung #1)
    var slot2Input = document.getElementById("attendancePdfInput_slot2");
    var slot2DocName = document.getElementById("attendanceDocName_slot2");
    if (slot2Input) slot2Input.value = "";
    var slot2Box = document.getElementById("slot2FileInfoBox");
    var slot2Name = document.getElementById("slot2FileName");
    var slot2Link = document.getElementById("slot2ViewLink");

    if (userSlots["slot2"] && userSlots["slot2"].fileUrl && userSlots["slot2"].fileUrl !== "#") {
      if (slot2DocName && !slot2DocName.value) slot2DocName.value = userSlots["slot2"].doc_name || "";
      if (slot2Name) slot2Name.innerText = (userSlots["slot2"].doc_name ? userSlots["slot2"].doc_name + ": " : "") + (userSlots["slot2"].fileName || "Dokumen Pendukung 1");
      if (slot2Link) slot2Link.href = userSlots["slot2"].fileUrl;
      if (slot2Box) slot2Box.classList.remove("hidden");
    } else {
      if (slot2Box) slot2Box.classList.add("hidden");
    }

    // Inisialisasi Slot 3 (Dokumen Pendukung #2)
    var slot3Input = document.getElementById("attendancePdfInput_slot3");
    var slot3DocName = document.getElementById("attendanceDocName_slot3");
    if (slot3Input) slot3Input.value = "";
    var slot3Box = document.getElementById("slot3FileInfoBox");
    var slot3Name = document.getElementById("slot3FileName");
    var slot3Link = document.getElementById("slot3ViewLink");

    if (userSlots["slot3"] && userSlots["slot3"].fileUrl && userSlots["slot3"].fileUrl !== "#") {
      if (slot3DocName && !slot3DocName.value) slot3DocName.value = userSlots["slot3"].doc_name || "";
      if (slot3Name) slot3Name.innerText = (userSlots["slot3"].doc_name ? userSlots["slot3"].doc_name + ": " : "") + (userSlots["slot3"].fileName || "Dokumen Pendukung 2");
      if (slot3Link) slot3Link.href = userSlots["slot3"].fileUrl;
      if (slot3Box) slot3Box.classList.remove("hidden");
    } else {
      if (slot3Box) slot3Box.classList.add("hidden");
    }

    modal.classList.remove("hidden");
  }

  function closeUploadAttendanceModal() {
    var modal = document.getElementById("uploadAttendanceModal");
    if (modal) modal.classList.add("hidden");
  }

  function handleDeleteSlotFile(slotKey) {
    var uid = currentUser ? currentUser.user_id : 'USR-0003';
    var periodFilter = document.getElementById("overtimePeriodFilter");
    var period = periodFilter ? periodFilter.value : UtilitiesFormatDateMonth();

    var slotNames = {
      slot1: "Form Absensi",
      slot2: "Dokumen Pendukung #1",
      slot3: "Dokumen Pendukung #2"
    };

    var label = slotNames[slotKey] || "Dokumen ini";
    showToast("Menghapus " + label + "...");

    callBackend('deleteAttendanceFile', [uid, period, slotKey], function(res) {
      if (res && res.success) {
        showToast(res.message || "Berkas berhasil dihapus!");

        if (currentAttendanceMap && currentAttendanceMap[uid]) {
          delete currentAttendanceMap[uid][slotKey];
        }

        var box = document.getElementById(slotKey + "FileInfoBox");
        if (box) box.classList.add("hidden");

        var fileInput = document.getElementById("attendancePdfInput_" + slotKey);
        if (fileInput) fileInput.value = "";

        if (slotKey === "slot2" || slotKey === "slot3") {
          var nameInput = document.getElementById("attendanceDocName_" + slotKey);
          if (nameInput) nameInput.value = "";
        }

        updateAttendanceBadgeUI(uid);
      } else {
        showToast(res ? res.error : "Gagal menghapus berkas!");
      }
    });
  }

  async function handleSaveMultiAttendance(e) {
    if (e && e.preventDefault) e.preventDefault();

    var uid = currentUser ? currentUser.user_id : 'USR-0003';
    var periodFilter = document.getElementById("overtimePeriodFilter");
    var period = periodFilter ? periodFilter.value : UtilitiesFormatDateMonth();

    var slot1File = document.getElementById("attendancePdfInput_slot1") ? document.getElementById("attendancePdfInput_slot1").files[0] : null;
    var slot2File = document.getElementById("attendancePdfInput_slot2") ? document.getElementById("attendancePdfInput_slot2").files[0] : null;
    var slot3File = document.getElementById("attendancePdfInput_slot3") ? document.getElementById("attendancePdfInput_slot3").files[0] : null;

    var slot2DocName = document.getElementById("attendanceDocName_slot2") ? document.getElementById("attendanceDocName_slot2").value.trim() : "";
    var slot3DocName = document.getElementById("attendanceDocName_slot3") ? document.getElementById("attendanceDocName_slot3").value.trim() : "";

    var userExisting = (currentAttendanceMap && currentAttendanceMap[uid]) ? currentAttendanceMap[uid] : {};

    if (!slot1File && !slot2File && !slot3File) {
      if (Object.keys(userExisting).length > 0) {
        showToast("Tidak ada berkas baru yang dipilih. Berkas sebelumnya tetap tersimpan.");
        closeUploadAttendanceModal();
        return;
      }
      showToast("Pilih minimal satu berkas PDF untuk diunggah!");
      return;
    }

    var uploadQueue = [];

    if (slot1File) {
      if (slot1File.type !== "application/pdf" && !slot1File.name.toLowerCase().endsWith(".pdf")) {
        showToast("Berkas Form Absensi harus berformat PDF (.pdf)!");
        return;
      }
      uploadQueue.push({
        slotKey: "slot1",
        docName: "Form Absensi",
        file: slot1File
      });
    }

    if (slot2File) {
      if (slot2File.type !== "application/pdf" && !slot2File.name.toLowerCase().endsWith(".pdf")) {
        showToast("Berkas Dokumen Pendukung #1 harus berformat PDF (.pdf)!");
        return;
      }
      uploadQueue.push({
        slotKey: "slot2",
        docName: slot2DocName || "Dokumen Pendukung #1",
        file: slot2File
      });
    }

    if (slot3File) {
      if (slot3File.type !== "application/pdf" && !slot3File.name.toLowerCase().endsWith(".pdf")) {
        showToast("Berkas Dokumen Pendukung #2 harus berformat PDF (.pdf)!");
        return;
      }
      uploadQueue.push({
        slotKey: "slot3",
        docName: slot3DocName || "Dokumen Pendukung #2",
        file: slot3File
      });
    }

    var spinner = document.getElementById("attendanceUploadSpinner");
    var spinnerText = document.getElementById("attendanceUploadSpinnerText");
    var btn = document.getElementById("btnSubmitAttendance");

    if (spinner) spinner.classList.remove("hidden");
    if (btn) btn.disabled = true;

    try {
      if (!currentAttendanceMap) currentAttendanceMap = {};
      if (!currentAttendanceMap[uid]) currentAttendanceMap[uid] = {};

      for (var q = 0; q < uploadQueue.length; q++) {
        var item = uploadQueue[q];
        if (spinnerText) {
          spinnerText.innerText = "Mengunggah " + item.docName + " (" + (q + 1) + "/" + uploadQueue.length + ")...";
        }

        var fileBase64Data = await readFileAsBase64(item.file);

        await new Promise(function(resolve, reject) {
          callBackend('saveAttendanceForm', [uid, period, item.slotKey, item.docName, fileBase64Data], function(res) {
            if (res && res.success) {
              currentAttendanceMap[uid][item.slotKey] = {
                attendance_id: res.attendance_id || "",
                slot_key: item.slotKey,
                doc_name: item.docName,
                fileName: res.fileName || item.file.name,
                fileUrl: res.fileUrl || "#"
              };
              resolve(res);
            } else {
              reject(new Error(res ? res.error : "Gagal mengunggah berkas " + item.docName));
            }
          });
        });
      }

      if (spinner) spinner.classList.add("hidden");
      if (btn) btn.disabled = false;

      showToast("Seluruh berkas berhasil diunggah & disimpan!");
      updateAttendanceBadgeUI(uid);
      closeUploadAttendanceModal();
    } catch(err) {
      if (spinner) spinner.classList.add("hidden");
      if (btn) btn.disabled = false;
      showToast("Kesalahan unggah: " + err.message);
    }
  }

  function updateAttendanceBadgeUI(uid) {
    var badge = document.getElementById("attendanceUploadedBadge");
    if (!badge) return;
    var targetUid = uid || (currentUser ? currentUser.user_id : "");
    var userSlots = (currentAttendanceMap && currentAttendanceMap[targetUid]) ? currentAttendanceMap[targetUid] : {};

    if (Object.keys(userSlots).length > 0) {
      badge.classList.remove("hidden");
    } else {
      badge.classList.add("hidden");
    }
  }
</script>
