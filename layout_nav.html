<!-- ANIMATED GLASSMORPHISM AUTH OVERLAY -->
<div id="authOverlay" class="fixed inset-0 z-50 auth-bg-gradient flex items-center justify-center p-4 overflow-y-auto">
  
  <!-- LOGIN FORM CARD -->
  <div id="loginCard" class="glass-card w-full max-w-md p-8 text-white relative">
    <div class="text-center mb-6 space-y-2">
      <div class="shiny-logo-wrapper inline-block">
        <svg viewBox="0 0 340 120" xmlns="http://www.w3.org/2000/svg" class="h-10 w-auto mx-auto">
          <text x="5" y="92" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="78" fill="#FFFFFF" letter-spacing="-2">KSPS</text>
          <g transform="translate(260, 55) scale(0.85)">
            <circle cx="0" cy="-42" r="11" fill="#F38F00" />
            <circle cx="40" cy="-13" r="11" fill="#F38F00" />
            <circle cx="25" cy="34" r="11" fill="#F38F00" />
            <circle cx="-25" cy="34" r="11" fill="#F38F00" />
            <circle cx="-40" cy="-13" r="11" fill="#F38F00" />
            <path d="M0,0 C10,-20 25,-35 0,-42 C-10,-25 -5,-10 0,0 Z" fill="#FFFFFF" />
            <path d="M0,0 C22,-5 38,5 40,-13 C22,-15 10,-5 0,0 Z" fill="#FFFFFF" transform="rotate(72)" />
            <path d="M0,0 C22,-5 38,5 40,-13 C22,-15 10,-5 0,0 Z" fill="#FFFFFF" transform="rotate(144)" />
            <path d="M0,0 C22,-5 38,5 40,-13 C22,-15 10,-5 0,0 Z" fill="#FFFFFF" transform="rotate(216)" />
            <path d="M0,0 C22,-5 38,5 40,-13 C22,-15 10,-5 0,0 Z" fill="#FFFFFF" transform="rotate(288)" />
          </g>
        </svg>
      </div>
      <h2 class="text-2xl font-extrabold tracking-tight">Selamat Datang</h2>
      <p class="text-xs text-white/80 font-medium">Masuk ke Portal e-LMS Data Center KSPS</p>
    </div>

    <form onsubmit="handleLogin(event)" class="space-y-4">
      <div class="relative">
        <input type="email" id="loginEmail" required placeholder="Alamat Email" class="glass-input w-full px-4 py-3 rounded-xl text-sm pr-10">
        <i class="fa-regular fa-envelope absolute right-3.5 top-1/2 transform -translate-y-1/2 text-white/60"></i>
      </div>

      <div class="relative">
        <input type="password" id="loginPassword" required placeholder="Password" class="glass-input w-full px-4 py-3 rounded-xl text-sm pr-10">
        <i class="fa-solid fa-lock absolute right-3.5 top-1/2 transform -translate-y-1/2 text-white/60"></i>
      </div>

      <div class="flex items-center justify-between text-xs text-white/80 pt-1">
        <label class="flex items-center space-x-2 cursor-pointer">
          <input type="checkbox" class="rounded bg-white/20 border-none text-amber-500 focus:ring-0">
          <span>Ingat Saya</span>
        </label>
      </div>

      <button type="submit" id="btnLoginSubmit" class="glass-btn w-full py-3 rounded-xl font-bold text-sm text-white shadow-lg mt-2">
        Masuk Sekarang <i class="fa-solid fa-arrow-right-to-bracket ml-2"></i>
      </button>
    </form>
  </div>
</div>
