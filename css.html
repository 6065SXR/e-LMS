<style>
  body {
    font-family: 'Plus Jakarta Sans', sans-serif;
    background-color: #f4f7fe;
    color: #1b2559;
  }
  
  .bg-teal-banner {
    background: linear-gradient(135deg, #2eb396 0%, #209279 100%);
  }
  .card-shadow {
    box-shadow: 0px 18px 40px rgba(112, 144, 176, 0.12);
    border-radius: 16px;
  }
  
  .btn-primary {
    background-color: #0095ff;
    color: #ffffff;
    transition: all 0.2s ease-in-out;
  }
  .btn-primary:hover {
    background-color: #007ce6;
    transform: translateY(-2px);
  }
  .text-navy {
    color: #1b2559;
  }
  .text-muted-grey {
    color: #a3aed0;
  }
  .active-nav {
    background-color: #0095ff;
    color: white !important;
    box-shadow: 0px 10px 20px rgba(0, 149, 255, 0.2);
  }

  .auth-bg-gradient {
    background: linear-gradient(135deg, #1e0533 0%, #511246 45%, #942b58 80%, #cf4a54 100%);
    background-size: 200% 200%;
    animation: gradientMove 12s ease infinite;
  }

  @keyframes gradientMove {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  .glass-card {
    background: rgba(255, 255, 255, 0.12);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.22);
    border-radius: 24px;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
    animation: glassFadeIn 0.5s cubic-bezier(0.16, 1, 0.3, 1);
  }

  @keyframes glassFadeIn {
    from {
      opacity: 0;
      transform: scale(0.92) translateY(20px);
    }
    to {
      opacity: 1;
      transform: scale(1) translateY(0);
    }
  }

  .glass-input {
    background: rgba(255, 255, 255, 0.15);
    border: 1px solid rgba(255, 255, 255, 0.3);
    color: #ffffff;
  }
  .glass-input::placeholder {
    color: rgba(255, 255, 255, 0.6);
  }
  .glass-input:focus {
    background: rgba(255, 255, 255, 0.25);
    border-color: rgba(255, 255, 255, 0.7);
    outline: none;
  }

  .glass-btn {
    background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
    box-shadow: 0 8px 20px rgba(37, 117, 252, 0.35);
    transition: all 0.3s ease;
  }
  .glass-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 25px rgba(37, 117, 252, 0.5);
  }

  .floating-bottom-nav {
    position: fixed;
    bottom: 14px;
    left: 16px;
    right: 16px;
    height: 64px;
    background: rgba(255, 255, 255, 0.72);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-radius: 28px;
    box-shadow: 0 12px 32px rgba(27, 37, 89, 0.12);
    border: 1px solid rgba(255, 255, 255, 0.65);
    display: flex;
    align-items: center;
    justify-content: space-around;
    z-index: 40;
    padding: 0 6px;
  }

  .floating-nav-item {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    flex: 1;
    height: 100%;
    color: #8f9bba;
    transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    background: transparent;
    border: none;
    cursor: pointer;
    outline: none;
  }

  .floating-icon-wrapper {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.15rem;
    transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    background: transparent;
    color: #8f9bba;
  }

  .floating-label {
    font-size: 10px;
    font-weight: 700;
    transition: all 0.3s ease;
    color: #8f9bba;
    position: absolute;
    bottom: 8px;
  }

  /* Active Floating State Effect (Translucent Bubble Cutout) */
  .floating-nav-item.active-mobile-nav .floating-icon-wrapper {
    transform: translateY(-20px) scale(1.12);
    background: linear-gradient(135deg, #0095ff 0%, #0066fe 100%);
    color: #ffffff !important;
    box-shadow: 0 10px 22px rgba(0, 149, 255, 0.45);
    border: 4px solid rgba(244, 247, 254, 0.95);
  }

  .floating-nav-item.active-mobile-nav .floating-label {
    color: #0095ff;
    font-weight: 800;
    transform: translateY(-2px);
  }
</style>
