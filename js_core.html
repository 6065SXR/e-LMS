  /**
   * GLOBAL CLICK OUTSIDE MODAL LISTENER
   * Clicking anywhere outside a modal's card (on the backdrop overlay) closes the modal.
   */
  function initClickOutsideModalListener() {
    document.addEventListener("click", function(e) {
      var modalIds = [
        "videoCheckpointModal", "dashboardDetailModal", "courseEmployeeDetailModal",
        "deleteCourseModal", "quizModal", "pdfModal", "videoModal",
        "editCourseModal", "employeeModal", "bulkEmployeeModal", "courseModal"
      ];

      modalIds.forEach(function(mId) {
        var modalEl = document.getElementById(mId);
        if (modalEl && !modalEl.classList.contains("hidden") && e.target === modalEl) {
          if (mId === "pdfModal") closePdfModal();
          else if (mId === "videoModal") closeVideoModal();
          else if (mId === "quizModal") closeQuizModal();
          else if (mId === "dashboardDetailModal") closeDashboardDetailModal();
          else if (mId === "courseEmployeeDetailModal") closeCourseEmployeeDetailModal();
          else if (mId === "deleteCourseModal") closeDeleteCourseModal();
          else if (mId === "editCourseModal") closeEditCourseModal();
          else if (mId === "employeeModal") closeEmployeeModal();
          else if (mId === "bulkEmployeeModal") closeBulkEmployeeModal();
          else if (mId === "courseModal") closeCourseModal();
          else modalEl.classList.add("hidden");
        }
      });
    });
  }

  function getGradeBadgeHtml(score) {
    var val = parseFloat(score) || 0;
    var badgeClass = "";
    var label = "";
    var icon = "";

    if (val >= 90) {
      badgeClass = "bg-emerald-50 text-emerald-700 border-emerald-200";
      label = "Grade A (" + val + ")";
      icon = '<i class="fa-solid fa-crown text-amber-500 mr-1"></i>';
    } else if (val >= 80) {
      badgeClass = "bg-indigo-50 text-[#1C1B8E] border-indigo-200";
      label = "Grade B (" + val + ")";
      icon = '<i class="fa-solid fa-shield-check text-[#1C1B8E] mr-1"></i>';
    } else if (val >= 70) {
      badgeClass = "bg-amber-50 text-amber-800 border-amber-200";
      label = "Grade C (" + val + ")";
      icon = '<i class="fa-solid fa-triangle-exclamation text-amber-600 mr-1"></i>';
    } else {
      badgeClass = "bg-rose-50 text-rose-700 border-rose-200";
      label = "Grade D (" + val + ")";
      icon = '<i class="fa-solid fa-circle-xmark text-rose-600 mr-1"></i>';
    }

    return '<span class="px-3 py-1 rounded-full text-xs font-bold border inline-flex items-center justify-center space-x-1 whitespace-nowrap ' + badgeClass + '" title="' + label + '">' +
      icon + '<span>' + label + '</span></span>';
  }

  function formatSecondsToMinSec(totalSeconds) {
    var sec = parseInt(totalSeconds, 10) || 0;
    if (sec <= 0) return "0 Menit";
    var m = Math.floor(sec / 60);
    var s = sec % 60;
    if (m === 0) return s + " Detik";
    if (s === 0) return m + " Menit";
    return m + "m " + s + "s";
  }

  function showToast(msg) {
    var toast = document.getElementById("toast");
    var toastMsg = document.getElementById("toastMsg");
    if (!toast || !toastMsg) return;
    toastMsg.innerText = msg;
    toast.classList.remove("hidden");
    setTimeout(function() { toast.classList.add("hidden"); }, 3500);
  }

  function switchTab(tabId) {
    var views = ['dashboard', 'katalog', 'karyawan', 'misi', 'overtime', 'users'];
    views.forEach(function(v) {
      var el = document.getElementById('view-' + v);
      var nav = document.getElementById('nav-' + v);
      var mNav = document.getElementById('mobile-nav-' + v);

      if (el) el.classList.add('hidden');
      if (nav) nav.classList.remove('active-nav');
      if (mNav) mNav.classList.remove('active-mobile-nav');
    });

    var activeEl = document.getElementById('view-' + tabId);
    var activeNav = document.getElementById('nav-' + tabId);
    var activeMNav = document.getElementById('mobile-nav-' + tabId);

    if (activeEl) activeEl.classList.remove('hidden');
    if (activeNav) activeNav.classList.add('active-nav');
    if (activeMNav) activeMNav.classList.add('active-mobile-nav');

    if (tabId === 'dashboard') loadDashboard();
    if (tabId === 'katalog') loadCourses(1);
    if (tabId === 'karyawan') loadEmployees();
    if (tabId === 'misi') loadMonthlyMissions();
    if (tabId === 'overtime') loadOvertimeData();
    if (tabId === 'users') loadUsers();
  }

  function convertToEmbedUrl(url) {
    if (!url || url === '#' || url.trim() === '') return '';
    var cleanUrl = url.trim();

    if (cleanUrl.indexOf('drive.google.com') !== -1) {
      var matchId = cleanUrl.match(/\/d\/([a-zA-Z0-9_-]+)/) || cleanUrl.match(/id=([a-zA-Z0-9_-]+)/) || cleanUrl.match(/\/file\/d\/([a-zA-Z0-9_-]+)/);
      if (matchId && matchId[1]) {
        return 'https://drive.google.com/file/d/' + matchId[1] + '/preview';
      }
      if (cleanUrl.indexOf('/preview') !== -1) return cleanUrl;
      cleanUrl = cleanUrl.replace(/\/view(\?.*)?$/, '/preview');
      cleanUrl = cleanUrl.replace(/\/edit(\?.*)?$/, '/preview');
      if (cleanUrl.indexOf('/preview') === -1) {
        cleanUrl = cleanUrl.replace(/\?usp=.*$/, '') + '/preview';
      }
      return cleanUrl;
    }

    if (cleanUrl.indexOf('youtube.com') !== -1 || cleanUrl.indexOf('youtu.be') !== -1) {
      var ytMatch = cleanUrl.match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|watch\?.+&v=))([\w-]{11})/);
      if (ytMatch && ytMatch[1]) {
        return 'https://www.youtube.com/embed/' + ytMatch[1] + '?autoplay=1&enablejsapi=1';
      }
    }

    return cleanUrl;
  }

  function readFileAsBase64(file) {
    return new Promise(function(resolve, reject) {
      if (!file) {
        resolve(null);
        return;
      }
      var reader = new FileReader();
      reader.onload = function(e) {
        resolve({
          name: file.name,
          type: file.type,
          base64: e.target.result
        });
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }
