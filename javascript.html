  function callBackend(funcName, params, callbackSuccess) {
    if (typeof google !== 'undefined' && google.script && google.script.run) {
      var runner = google.script.run
        .withSuccessHandler(function(res) {
          if (callbackSuccess) callbackSuccess(res);
        })
        .withFailureHandler(function(err) {
          showToast("Error: " + err);
        });
      runner[funcName].apply(runner, params);
    } else {
      console.warn("Menjalankan mode simulasi Canvas ( google.script.run tidak terdefinisi )");
      setTimeout(function() {
        if (funcName === 'loginUser') {
          var inputEmail = (params[0] || '').toLowerCase();
          var simulatedRole = 'Karyawan';
          var simulatedName = 'Eko Tech Operator';
          var simulatedUserId = 'USR-0003';

          if (inputEmail.indexOf('admin') !== -1) {
            simulatedRole = 'Super Admin';
            simulatedName = 'Admin Data Center';
            simulatedUserId = 'USR-0001';
          } else if (inputEmail.indexOf('pm') !== -1 || inputEmail.indexOf('budi') !== -1) {
            simulatedRole = 'Project Manager';
            simulatedName = 'Budi PM Infrastructure';
            simulatedUserId = 'USR-0002';
          }

          callbackSuccess({
            success: true,
            user: { user_id: simulatedUserId, name: simulatedName, role: simulatedRole, email: params[0], departemen: 'Operations', site: 'CGK1' }
          });
        } else if (funcName === 'getEmployeesList') {
          callbackSuccess({
            success: true,
            data: [
              { employee_id: 'EMP-0001', nik: '31710123001', nama_lengkap: 'Eko Tech Operator', email: 'eko.tech@datacenter.com', jabatan: 'Junior DC Technician', departemen: 'Operations', site: 'CGK3', materi_download: 2, materi_soal: 1, status_karyawan: 'Aktif' },
              { employee_id: 'EMP-0002', nik: '31710123002', nama_lengkap: 'Rina DC Technician', email: 'rina.tech@datacenter.com', jabatan: 'Cabling Specialist', departemen: 'Network & Cabling', site: 'CGK3A', materi_download: 1, materi_soal: 0, status_karyawan: 'Aktif' }
            ]
          });
        } else if (funcName === 'getMonthlyMissionsData') {
          callbackSuccess({
            success: true,
            userRole: params[1] || 'Karyawan',
            misiStatus: { target: 2, completed: 1, status: 'In Progress' },
            assignedCourses: [
              { course_id: 'CRS-0001', judul_materi: 'Cooling System CRAH & Chiller SOP', kategori_dc: 'Introduction', pdf_link: 'https://www.w3.org/WAI/ER/tests/xhtml/testfiles/resources/pdf/dummy.pdf', video_url: 'https://drive.google.com/file/d/15YCCYywuOOPVhr_J_0DUdx4p-hA6uKF8/view?usp=sharing', is_pdf_downloaded: true, is_video_watched: false, quiz_score: 85, is_completed: true },
              { course_id: 'CRS-0002', judul_materi: 'Redundansi UPS N+1 Maintenance', kategori_dc: 'Data Center Fundamental (Basic)', pdf_link: 'https://www.w3.org/WAI/ER/tests/xhtml/testfiles/resources/pdf/dummy.pdf', video_url: 'https://drive.google.com/file/d/15YCCYywuOOPVhr_J_0DUdx4p-hA6uKF8/view?usp=sharing', is_pdf_downloaded: false, is_video_watched: false, quiz_score: 0, is_completed: false }
            ],
            stats: { totalKaryawan: 2, selesai: 1, dalamProses: 1, belumStart: 0 },
            tableData: [
              { user_id: 'USR-0003', nik: '31710123001', nama_lengkap: 'Eko Tech Operator', site: 'CGK3', departemen: 'Operations', materi_assigned: 'Cooling System CRAH | UPS N+1', materi_selesai: 1, target_materi: 2, status: 'In Progress' },
              { user_id: 'USR-0004', nik: '31710123002', nama_lengkap: 'Rina DC Technician', site: 'CGK3A', departemen: 'Network', materi_assigned: 'Fiber Patching | Cable Ladder', materi_selesai: 2, target_materi: 2, status: 'Completed' }
            ]
          });
        } else {
          callbackSuccess({ success: true, message: 'Simulasi berhasil!' });
        }
      }, 800);
    }
  }

  document.addEventListener("DOMContentLoaded", function() {
    checkUserSession();
    initChart();
  });

  function checkUserSession() {
    var savedUser = localStorage.getItem("elms_session");
    if (savedUser) {
      currentUser = JSON.parse(savedUser);
      document.getElementById("authOverlay").classList.add("hidden");
      updateUIForUser();
      loadDashboard();
      loadCourses(1);
    } else {
      document.getElementById("authOverlay").classList.remove("hidden");
    }
  }

  function toggleAuthMode(mode) {
    var loginCard = document.getElementById("loginCard");
    var regCard = document.getElementById("registerCard");

    if (mode === 'register') {
      loginCard.classList.add("hidden");
      regCard.classList.remove("hidden");
    } else {
      regCard.classList.add("hidden");
      loginCard.classList.remove("hidden");
    }
  }

  function handleLogin(e) {
    e.preventDefault();
    var email = document.getElementById("loginEmail").value;
    var pass = document.getElementById("loginPassword").value;
    var btn = document.getElementById("btnLoginSubmit");

    btn.disabled = true;
    btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin mr-2"></i> Memproses...';

    callBackend('loginUser', [email, pass], function(res) {
      btn.disabled = false;
      btn.innerHTML = 'Masuk Sekarang <i class="fa-solid fa-arrow-right-to-bracket ml-2"></i>';

      if (res.success) {
        currentUser = res.user;
        localStorage.setItem("elms_session", JSON.stringify(currentUser));
        document.getElementById("authOverlay").classList.add("hidden");
        showToast("Selamat datang kembali, " + currentUser.name);
        updateUIForUser();
        loadDashboard();
        loadCourses(1);
      } else {
        showToast(res.error);
      }
    });
  }

  function handleRegister(e) {
    e.preventDefault();
    var data = {
      nama: document.getElementById("regName").value,
      email: document.getElementById("regEmail").value,
      password: document.getElementById("regPassword").value,
      departemen: document.getElementById("regDept").value,
      site: document.getElementById("regSite").value
    };

    var btn = document.getElementById("btnRegisterSubmit");
    btn.disabled = true;
    btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin mr-2"></i> Mengirim Link Otentikasi...';

    callBackend('registerUser', [data], function(res) {
      btn.disabled = false;
      btn.innerHTML = 'Register';

      if (res.success) {
        showToast(res.message);
        toggleAuthMode('login');
      } else {
        showToast("Gagal: " + res.error);
      }
    });
  }

  function logoutUser() {
    localStorage.removeItem("elms_session");
    currentUser = null;
    document.getElementById("authOverlay").classList.remove("hidden");
    showToast("Anda telah keluar dari aplikasi.");
  }

  function updateUIForUser() {
    if (!currentUser) return;
    document.getElementById("userNameDisplay").innerText = currentUser.name;
    document.getElementById("userRoleBadge").innerText = currentUser.role;

    var roleSelector = document.getElementById("roleSelector");
    if (roleSelector) roleSelector.value = currentUser.role;

    var pmElems = document.querySelectorAll('.role-pm');
    var adminElems = document.querySelectorAll('.role-admin');

    pmElems.forEach(function(el) { el.classList.add('hidden'); });
    adminElems.forEach(function(el) { el.classList.add('hidden'); });

    if (currentUser.role === 'Project Manager') {
      pmElems.forEach(function(el) { el.classList.remove('hidden'); });
    } else if (currentUser.role === 'Super Admin') {
      pmElems.forEach(function(el) { el.classList.remove('hidden'); });
      adminElems.forEach(function(el) { el.classList.remove('hidden'); });
    }
  }

  function handleRoleChange() {
    var val = document.getElementById("roleSelector").value;
    currentUser.role = val;
    updateUIForUser();
    loadDashboard();
    loadCourses(1);
  }

  function showToast(msg) {
    var toast = document.getElementById("toast");
    var toastMsg = document.getElementById("toastMsg");
    toastMsg.innerText = msg;
    toast.classList.remove("hidden");
    setTimeout(function() { toast.classList.add("hidden"); }, 3500);
  }

  function switchTab(tabId) {
    var views = ['dashboard', 'katalog', 'karyawan', 'misi', 'users'];
    views.forEach(function(v) {
      var el = document.getElementById('view-' + v);
      var nav = document.getElementById('nav-' + v);
      if (el) el.classList.add('hidden');
      if (nav) nav.classList.remove('active-nav');
    });

    var activeEl = document.getElementById('view-' + tabId);
    var activeNav = document.getElementById('nav-' + tabId);
    if (activeEl) activeEl.classList.remove('hidden');
    if (activeNav) activeNav.classList.add('active-nav');

    if (tabId === 'karyawan') loadEmployees();
    if (tabId === 'misi') loadMonthlyMissions();
    if (tabId === 'users') loadUsers();
  }

    document.getElementById("employeeModal").classList.remove("hidden");

  function handleBulkUploadEmployee(e) {
    e.preventDefault();

    var file = fileInput.files[0];

    if (!file) {
      showToast("Harap pilih berkas CSV terlebih dahulu!");
      return;
    }

    var btn = document.getElementById("btnSubmitBulk");
    btn.disabled = true;
    btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin mr-1"></i> Memproses...';

    var reader = new FileReader();
    reader.onload = function(evt) {
      var csvText = evt.target.result;

        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-cloud-arrow-up mr-1"></i> <span>Proses Upload</span>';

      if (res.success) {
        renderCourseTable(res.data, res.currentPage, 10);
        renderPaginationControls(res.currentPage, res.totalPages, res.totalItems);
      }
    });

      tbody.innerHTML = '<tr><td colspan="7" class="text-center text-muted-grey text-sm py-8">Tidak ada materi ditemukan.</td></tr>';
      return;
    }

    var isPmOrAdmin = currentUser && (currentUser.role === 'Project Manager' || currentUser.role === 'Super Admin');

    list.forEach(function(item, idx) {
      var rowNo = (currentPage - 1) * limit + idx + 1;
      var tr = document.createElement("tr");
      tr.className = "hover:bg-blue-50/30 transition";

      var groupBadge = '<span class="text-[11px] bg-teal-50 text-teal-700 px-2.5 py-1 rounded-full font-bold inline-block">' + item.kategori_dc + '</span>';
      var pesertaText = item.peserta_selesai + " / " + item.total_peserta + " Selesai";
      var avgScoreDisplay = item.avg_score > 0 ? (item.avg_score + " / 100") : "Belum ada";

      var safeTitle = (item.judul_materi || '').replace(/'/g, "\\'");
      var safePdf = (item.pdf_link || '').replace(/'/g, "\\'");
      var safeVideo = (item.video_url || '').replace(/'/g, "\\'");

      var content = '<td class="py-3.5 px-4 text-center font-bold text-muted-grey text-xs">' + rowNo + '</td>' +
                    '<td class="py-3.5 px-4">' + groupBadge + '</td>' +
                    '<td class="py-3.5 px-4 font-bold text-navy text-sm">' + item.judul_materi + '</td>' +
                    '<td class="py-3.5 px-4 text-xs font-semibold text-muted-grey">' + (item.created_by || "PM Infrastructure") + '</td>' +
                    '<td class="py-3.5 px-4 text-center">' +
                      '<span class="bg-blue-50 text-blue-600 px-3 py-1 rounded-full text-xs font-bold">' + pesertaText + '</span>' +
                    '</td>' +
                    '<td class="py-3.5 px-4 text-center font-bold text-sm text-navy">' + avgScoreDisplay + '</td>' +
                    '<td class="py-3.5 px-4 text-center">' +
                      '<div class="flex items-center justify-center space-x-1.5">' +
                        '<button type="button" onclick="trackPdf(\'' + item.course_id + '\', \'' + safePdf + '\', \'' + safeTitle + '\')" class="w-8 h-8 rounded-lg bg-red-50 text-red-500 hover:bg-red-100 flex items-center justify-center transition" title="Buka PDF SOP"><i class="fa-solid fa-file-pdf"></i></button>' +
                        '<button type="button" onclick="trackVideo(\'' + item.course_id + '\', \'' + safeVideo + '\', \'' + safeTitle + '\')" class="w-8 h-8 rounded-lg bg-blue-50 text-blue-500 hover:bg-blue-100 flex items-center justify-center transition" title="Nonton Video"><i class="fa-solid fa-play"></i></button>' +
                        '<button type="button" onclick="openQuizModal(\'' + item.course_id + '\', \'' + safeTitle + '\')" class="w-8 h-8 rounded-lg btn-primary text-xs flex items-center justify-center transition" title="Kerjakan Kuis"><i class="fa-solid fa-pen-to-square"></i></button>' +
                        editBtnHtml +
                      '</div>' +

      tr.innerHTML = content;

  function renderPaginationControls(current, total, totalItems) {
    document.getElementById("paginationInfo").innerText = "Menampilkan Halaman " + current + " dari " + total + " (" + totalItems + " Materi)";
    var ctrl = document.getElementById("paginationControls");
    ctrl.innerHTML = "";

    for (var i = 1; i <= total; i++) {
      var btn = document.createElement("button");
      btn.type = "button";
      btn.innerText = i;
      btn.className = "w-8 h-8 rounded-lg text-xs font-bold " + (i === current ? "bg-blue-500 text-white" : "bg-gray-100 text-navy");
      (function(page) {
        btn.onclick = function() { loadCourses(page); };
      })(i);
      ctrl.appendChild(btn);
    }
  }

  function readFileAsBase64(file) {
    return new Promise(function(resolve, reject) {
      if (!file) {
        resolve(null);
        return;
      }
      var reader = new FileReader();
      reader.onload = function(e) {
        resolve({
          name: file.name,
          type: file.type,
          base64: e.target.result
        });
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  async function handleCreateCourse(e) {
    e.preventDefault();
    
    var titleInput = document.getElementById("newTitle").value;
    var categoryInput = document.getElementById("newCategory").value;
    var pdfFile = document.getElementById("pdfFileInput").files[0];
    var videoUrlInput = document.getElementById("videoUrlInput").value;
    var quizText = document.getElementById("quizTextInput") ? document.getElementById("quizTextInput").value : "";

    if (!pdfFile) {
      showToast("Harap pilih file PDF terlebih dahulu!");
      return;
    }

    if (!videoUrlInput || videoUrlInput.trim() === "") {
      showToast("Harap masukkan Tautan/Link Video terlebih dahulu!");
      return;
    }

    document.getElementById("uploadProgressIndicator").classList.remove("hidden");
    document.getElementById("btnSubmitCreate").disabled = true;

    try {
      var pdfData = await readFileAsBase64(pdfFile);

      var courseData = {
        judul_materi: titleInput,
        kategori_dc: categoryInput,
        created_by: currentUser ? currentUser.name : "Project Manager"
      };

      callBackend('saveCourseWithFiles', [courseData, pdfData, videoUrlInput, quizText], function(res) {
        document.getElementById("uploadProgressIndicator").classList.add("hidden");
        document.getElementById("btnSubmitCreate").disabled = false;

        if (res.success) {
          showToast(res.message);
          document.getElementById("newTitle").value = "";
          document.getElementById("pdfFileInput").value = "";
          document.getElementById("videoUrlInput").value = "";
          if (document.getElementById("quizTextInput")) document.getElementById("quizTextInput").value = "";
          closeCourseModal();
          loadCourses(1);
        } else {
          showToast("Gagal: " + res.error);
        }
      });
    } catch (err) {
      document.getElementById("uploadProgressIndicator").classList.add("hidden");
      document.getElementById("btnSubmitCreate").disabled = false;
      showToast("Error membaca file: " + err);
    }
  }

  async function handleEditCourse(e) {
    e.preventDefault();
    
    var courseId = document.getElementById("editCourseId").value;
    var titleInput = document.getElementById("editTitle").value;
    var categoryInput = document.getElementById("editCategory").value;
    var pdfFile = document.getElementById("editPdfFileInput").files[0];
    var videoUrlInput = document.getElementById("editVideoUrlInput").value;
    var quizText = document.getElementById("editQuizTextInput").value;

    document.getElementById("editUploadIndicator").classList.remove("hidden");
    document.getElementById("btnSubmitEdit").disabled = true;

    try {
      var pdfData = pdfFile ? await readFileAsBase64(pdfFile) : null;

      var courseData = {
        judul_materi: titleInput,
        kategori_dc: categoryInput
      };

      callBackend('updateCourseWithFiles', [courseId, courseData, pdfData, videoUrlInput, quizText], function(res) {
        document.getElementById("editUploadIndicator").classList.add("hidden");
        document.getElementById("btnSubmitEdit").disabled = false;

        if (res.success) {
          showToast(res.message);
          closeEditCourseModal();
          loadCourses(1);
        } else {
          showToast("Gagal memperbarui: " + res.error);
        }
      });
    } catch (err) {
      document.getElementById("editUploadIndicator").classList.add("hidden");
      document.getElementById("btnSubmitEdit").disabled = false;
      showToast("Error membaca file: " + err);
    }
  }

  function convertToEmbedUrl(url) {
    if (!url || url === '#' || url.trim() === '') return '';
    var cleanUrl = url.trim();

    // Google Drive URL handling
    if (cleanUrl.indexOf('drive.google.com') !== -1) {
      var matchId = cleanUrl.match(/\/d\/([a-zA-Z0-9_-]+)/) || cleanUrl.match(/id=([a-zA-Z0-9_-]+)/);
      if (matchId && matchId[1]) {
        return 'https://drive.google.com/file/d/' + matchId[1] + '/preview';
      }
      if (cleanUrl.indexOf('/preview') !== -1) return cleanUrl;
      cleanUrl = cleanUrl.replace(/\/view(\?.*)?$/, '/preview');
      cleanUrl = cleanUrl.replace(/\/edit(\?.*)?$/, '/preview');
      if (cleanUrl.indexOf('/preview') === -1) {
        cleanUrl = cleanUrl.replace(/\?usp=.*$/, '') + '/preview';
      }
      return cleanUrl;
    }

    // YouTube URL handling
    if (cleanUrl.indexOf('youtube.com') !== -1 || cleanUrl.indexOf('youtu.be') !== -1) {
      var ytMatch = cleanUrl.match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|watch\?.+&v=))([\w-]{11})/);
      if (ytMatch && ytMatch[1]) {
        return 'https://www.youtube.com/embed/' + ytMatch[1] + '?autoplay=1';
      }
    }

    return cleanUrl;
  }

  function trackPdf(courseId, pdfUrl, title, videoUrl) {
    if (!pdfUrl || pdfUrl === '#' || pdfUrl.trim() === '') {
      showToast("Dokumen PDF belum diunggah atau tautan tidak valid.");
      return;
    }

    activeMediaCourseId = courseId;
    activeMediaTitle = title || "SOP Pelatihan";
    activeMediaPdfUrl = pdfUrl;
    if (videoUrl) activeMediaVideoUrl = videoUrl;

    var embedUrl = convertToEmbedUrl(pdfUrl);
    var pdfFrame = document.getElementById("pdfFrame");
    if (pdfFrame) pdfFrame.src = embedUrl;

    document.getElementById("pdfModal").classList.remove("hidden");
    showToast("Membuka PDF SOP di Pop-Up Modal...");

    var uid = currentUser ? currentUser.user_id : 'USR-0003';
    callBackend('recordUserProgress', [{ user_id: uid, course_id: courseId, is_pdf_downloaded: true }], function(res) {
      if (res && res.success) {
        isCurrentPdfTracked = true;
        if (res.is_video) isCurrentVideoTracked = true;
        updateMediaSequentialButtons();
      }
      loadDashboard();
      if (document.getElementById("view-misi") && !document.getElementById("view-misi").classList.contains("hidden")) {
        loadMonthlyMissions();
      }
    });
  }

  function closePdfModal() {
    var pdfFrame = document.getElementById("pdfFrame");
    if (pdfFrame) pdfFrame.src = "";
    document.getElementById("pdfModal").classList.add("hidden");
  }

  function trackVideo(courseId, videoUrl, title, pdfUrl) {
    if (!videoUrl || videoUrl === '#' || videoUrl.trim() === '') {
      showToast("Video pelatihan belum diunggah atau tautan tidak valid.");
      return;
    }

    activeMediaCourseId = courseId;
    activeMediaTitle = title || "Video Pelatihan";
    activeMediaVideoUrl = videoUrl;
    if (pdfUrl) activeMediaPdfUrl = pdfUrl;

    var embedUrl = convertToEmbedUrl(videoUrl);
    var videoFrame = document.getElementById("videoFrame");

    if (videoFrame) videoFrame.src = embedUrl;

    document.getElementById("videoModal").classList.remove("hidden");
    showToast("Memutar Video di Pop-Up Modal...");

    var uid = currentUser ? currentUser.user_id : 'USR-0003';
    callBackend('recordUserProgress', [{ user_id: uid, course_id: courseId, is_video_watched: true }], function(res) {
      if (res && res.success) {
        isCurrentVideoTracked = true;
        if (res.is_pdf) isCurrentPdfTracked = true;
        updateMediaSequentialButtons();
      }
      loadDashboard();
      if (document.getElementById("view-misi") && !document.getElementById("view-misi").classList.contains("hidden")) {
        loadMonthlyMissions();
      }
    });
  }

  function closeVideoModal() {
    var videoFrame = document.getElementById("videoFrame");
    if (videoFrame) videoFrame.src = "";
    document.getElementById("videoModal").classList.add("hidden");
  }

  function updateMediaSequentialButtons() {
    var btnPdfToQuiz = document.getElementById("btnPdfToQuiz");
    var btnVideoToQuiz = document.getElementById("btnVideoToQuiz");

    if (isCurrentPdfTracked && isCurrentVideoTracked) {
      if (btnPdfToQuiz) btnPdfToQuiz.classList.remove("hidden");
      if (btnVideoToQuiz) btnVideoToQuiz.classList.remove("hidden");
    } else {
      if (btnPdfToQuiz) btnPdfToQuiz.classList.add("hidden");
      if (btnVideoToQuiz) btnVideoToQuiz.classList.add("hidden");
    }
  }

  function nextFromPdfToVideo() {
    closePdfModal();
    if (activeMediaCourseId && activeMediaVideoUrl) {
      trackVideo(activeMediaCourseId, activeMediaVideoUrl, activeMediaTitle, activeMediaPdfUrl);
    } else {
      showToast("Memuat video...");
    }
  }

  function backFromVideoToPdf() {
    closeVideoModal();
    if (activeMediaCourseId && activeMediaPdfUrl) {
      trackPdf(activeMediaCourseId, activeMediaPdfUrl, activeMediaTitle, activeMediaVideoUrl);
    } else {
      showToast("Memuat dokumen PDF...");
    }
  }

  function openQuizFromMedia() {
    closePdfModal();
    closeVideoModal();
    if (activeMediaCourseId) {
      openQuizModal(activeMediaCourseId, activeMediaTitle);
    }
  }

  function openQuizModal(courseId, title) {
    activeCourseForQuiz = courseId;
    document.getElementById("quizModalTitle").innerText = "Kuis: " + title;
    
    callBackend('getQuizForCourse', [courseId], function(res) {
      if (res.success && res.data.length > 0) {
        currentQuizList = res.data;
        var container = document.getElementById("quizContent");
        container.innerHTML = "";

        res.data.forEach(function(q, idx) {
          var qEl = document.createElement("div");
          qEl.className = "space-y-2 border-b border-gray-100 pb-3";
          qEl.innerHTML = '<p class="font-bold text-sm text-navy">' + (idx + 1) + '. ' + q.pertanyaan + '</p>' +
            '<div class="space-y-1 text-xs">' +
              '<label class="flex items-center space-x-2 cursor-pointer"><input type="radio" name="q_' + idx + '" value="A"> <span>A. ' + q.opsi_a + '</span></label>' +
              '<label class="flex items-center space-x-2 cursor-pointer"><input type="radio" name="q_' + idx + '" value="B"> <span>B. ' + q.opsi_b + '</span></label>' +
              '<label class="flex items-center space-x-2 cursor-pointer"><input type="radio" name="q_' + idx + '" value="C"> <span>C. ' + q.opsi_c + '</span></label>' +
              '<label class="flex items-center space-x-2 cursor-pointer"><input type="radio" name="q_' + idx + '" value="D"> <span>D. ' + q.opsi_d + '</span></label>' +
            '</div>';
          container.appendChild(qEl);
        });

        document.getElementById("quizModal").classList.remove("hidden");
      } else {
        showToast("Belum ada soal kuis untuk materi ini.");
      }
    });
  }

  function closeQuizModal() {
    document.getElementById("quizModal").classList.add("hidden");
  }

  function submitQuizAnswers() {
    var total = currentQuizList.length;
    var correct = 0;

    currentQuizList.forEach(function(q, idx) {
      var selected = document.querySelector('input[name="q_' + idx + '"]:checked');
      if (selected && selected.value === q.jawaban_benar) {
        correct++;
      }
    });

    var score = Math.round((correct / total) * 100);
    showToast("Kuis Selesai! Skor Anda: " + score);
    closeQuizModal();

    var uid = currentUser ? currentUser.user_id : 'USR-0003';
    callBackend('recordUserProgress', [{ user_id: uid, course_id: activeCourseForQuiz, quiz_score: score }], function() {
      loadDashboard();
      loadCourses(1);
      if (document.getElementById("view-misi") && !document.getElementById("view-misi").classList.contains("hidden")) {
        loadMonthlyMissions();
      }
    });
  }

  function loadMonthlyMissions() {
    var uid = currentUser ? currentUser.user_id : 'USR-0003';
    var uRole = currentUser ? currentUser.role : 'Karyawan';
    var period = document.getElementById("missionPeriodFilter").value || '2026-09';

    callBackend('getMonthlyMissionsData', [uid, uRole, period], function(res) {
      if (res.success) {
        if (res.userRole === "Karyawan") {
          document.getElementById("employeeMissionView").classList.remove("hidden");
          document.getElementById("adminMissionView").classList.add("hidden");
          renderEmployeeMissionView(res);
        } else {
          document.getElementById("employeeMissionView").classList.add("hidden");
          document.getElementById("adminMissionView").classList.remove("hidden");
          renderAdminMissionView(res);
        }
      }
    });
  }

  function renderEmployeeMissionView(res) {
    var badge = document.getElementById("myMissionProgressBadge");
    var statusText = document.getElementById("myMissionStatusText");
    badge.innerText = res.misiStatus.completed + " / " + res.misiStatus.target + " Selesai";
    statusText.innerText = res.misiStatus.status === "Completed" ? "Tuntas 100% - Sangat Baik!" : "Selesaikan 2 Materi Wajib Bulan Ini";

    var container = document.getElementById("assignedCoursesContainer");
    container.innerHTML = "";

    if (!res.assignedCourses || res.assignedCourses.length === 0) {
      container.innerHTML = '<div class="col-span-2 text-center text-muted-grey text-sm py-8 bg-white rounded-2xl card-shadow">Belum ada materi ditugaskan untuk bulan ini.</div>';
      return;
    }

    res.assignedCourses.forEach(function(item, idx) {
      var card = document.createElement("div");
      card.className = "bg-white p-5 rounded-2xl card-shadow space-y-4 border border-gray-100";

      var statusBadge = item.is_completed ?
        '<span class="bg-emerald-50 text-emerald-600 px-3 py-1 rounded-full text-xs font-bold flex items-center space-x-1"><i class="fa-solid fa-circle-check"></i> <span>TUNTAS</span></span>' :
        '<span class="bg-amber-50 text-amber-600 px-3 py-1 rounded-full text-xs font-bold flex items-center space-x-1"><i class="fa-solid fa-spinner fa-spin"></i> <span>DALAM PROSES</span></span>';

      var pdfCheck = item.is_pdf_downloaded ? '<i class="fa-solid fa-circle-check text-emerald-500 ml-1"></i>' : '<i class="fa-regular fa-circle text-gray-300 ml-1"></i>';
      var vidCheck = item.is_video_watched ? '<i class="fa-solid fa-circle-check text-emerald-500 ml-1"></i>' : '<i class="fa-regular fa-circle text-gray-300 ml-1"></i>';
      var quizCheck = item.quiz_score >= 80 ? '<i class="fa-solid fa-circle-check text-emerald-500 ml-1"></i> (Skor: ' + item.quiz_score + ')' : '<i class="fa-regular fa-circle text-gray-300 ml-1"></i>';

      var safeTitle = (item.judul_materi || '').replace(/'/g, "\\'");
      var safePdf = (item.pdf_link || '').replace(/'/g, "\\'");
      var safeVideo = (item.video_url || '').replace(/'/g, "\\'");

      card.innerHTML = '<div class="flex items-center justify-between">' +
                          '<span class="text-xs bg-teal-50 text-teal-700 px-2.5 py-1 rounded-full font-bold">Misi #' + (idx + 1) + ' • ' + item.kategori_dc + '</span>' +
                          statusBadge +
                        '</div>' +
                        '<div>' +
                          '<h4 class="font-bold text-navy text-base">' + item.judul_materi + '</h4>' +
                          '<div class="mt-2 text-xs text-muted-grey space-y-1">' +
                            '<p class="flex items-center"><span>1. Baca PDF SOP</span> ' + pdfCheck + '</p>' +
                            '<p class="flex items-center"><span>2. Nonton Video</span> ' + vidCheck + '</p>' +
                            '<p class="flex items-center"><span>3. Kuis (Min. Skor 80)</span> ' + quizCheck + '</p>' +
                          '</div>' +
                        '</div>' +
                        '<div class="pt-3 border-t border-gray-100 flex items-center justify-end space-x-2">' +
                          '<button type="button" onclick="trackPdf(\'' + item.course_id + '\', \'' + safePdf + '\', \'' + safeTitle + '\', \'' + safeVideo + '\')" class="px-3 py-1.5 rounded-xl bg-red-50 text-red-500 hover:bg-red-100 text-xs font-bold transition flex items-center space-x-1"><i class="fa-solid fa-file-pdf"></i> <span>PDF</span></button>' +
                          '<button type="button" onclick="trackVideo(\'' + item.course_id + '\', \'' + safeVideo + '\', \'' + safeTitle + '\', \'' + safePdf + '\')" class="px-3 py-1.5 rounded-xl bg-blue-50 text-blue-500 hover:bg-blue-100 text-xs font-bold transition flex items-center space-x-1"><i class="fa-solid fa-play"></i> <span>Video</span></button>' +
                          '<button type="button" onclick="openQuizModal(\'' + item.course_id + '\', \'' + safeTitle + '\')" class="btn-primary px-3 py-1.5 rounded-xl text-xs font-bold flex items-center space-x-1"><i class="fa-solid fa-pen-to-square"></i> <span>Kuis</span></button>' +
                        '</div>';

      container.appendChild(card);
    });
  }

  function renderAdminMissionView(res) {
    document.getElementById("statMsnTotal").innerText = res.stats.totalKaryawan;
    document.getElementById("statMsnSelesai").innerText = res.stats.selesai;
    document.getElementById("statMsnProses").innerText = res.stats.dalamProses;
    document.getElementById("statMsnBelum").innerText = res.stats.belumStart;

    var tbody = document.getElementById("adminMissionTableBody");
    tbody.innerHTML = "";

    if (!res.tableData || res.tableData.length === 0) {
      tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted-grey text-sm py-8">Belum ada data misi untuk periode ini.</td></tr>';
      return;
    }

    res.tableData.forEach(function(row, idx) {
      var tr = document.createElement("tr");
      tr.className = "hover:bg-blue-50/30 transition border-b border-gray-50";

      var badgeClass = row.status === "Completed" ? "bg-emerald-50 text-emerald-600" : (row.status === "In Progress" ? "bg-amber-50 text-amber-600" : "bg-rose-50 text-rose-600");

      tr.innerHTML = '<td class="py-3 px-3 text-center font-bold text-muted-grey text-xs">' + (idx + 1) + '</td>' +
                     '<td class="py-3 px-3"><div class="font-bold text-navy text-xs">' + row.nama_lengkap + '</div><div class="text-[10px] text-muted-grey">' + row.nik + '</div></td>' +
                     '<td class="py-3 px-3 text-center"><span class="bg-indigo-50 text-indigo-600 px-2.5 py-0.5 rounded-full text-[11px] font-bold">' + row.site + '</span></td>' +
                     '<td class="py-3 px-3 text-xs text-navy font-medium">' + row.materi_assigned + '</td>' +
                     '<td class="py-3 px-3 text-center font-bold text-xs text-navy">' + row.materi_selesai + ' / ' + row.target_materi + '</td>' +
                     '<td class="py-3 px-3 text-center"><span class="' + badgeClass + ' px-2.5 py-1 rounded-full text-[11px] font-bold">' + row.status + '</span></td>';

      tbody.appendChild(tr);
    });
  }

  function loadUsers() {
    callBackend('getUsersList', [], function(res) {
      if (res.success) {
        var tbody = document.getElementById("userTableBody");
        tbody.innerHTML = "";
        res.data.forEach(function(u) {
          var verifiedBadge = u.is_verified === 'TRUE' ? 
            '<span class="bg-emerald-50 text-emerald-600 px-2 py-0.5 rounded-full text-xs font-semibold">Verified</span>' : 
            '<span class="bg-amber-50 text-amber-600 px-2 py-0.5 rounded-full text-xs font-semibold">Pending</span>';

          var tr = document.createElement("tr");
          tr.innerHTML = '<td class="py-2 px-2 font-bold">' + u.user_id + '</td>' +
                         '<td class="py-2 px-2">' + u.nama_lengkap + '</td>' +
                         '<td class="py-2 px-2 text-muted-grey">' + u.email + '</td>' +
                         '<td class="py-2 px-2"><span class="bg-blue-50 text-blue-600 px-2 py-0.5 rounded-full text-xs font-semibold">' + u.role + '</span></td>' +
                         '<td class="py-2 px-2 text-muted-grey">' + u.departemen + '</td>' +
                         '<td class="py-2 px-2 text-center">' + verifiedBadge + '</td>';
          tbody.appendChild(tr);
        });
      }
    });
  }

  function handleSearch() {
    loadCourses(1);
  }

  function initChart() {
    var ctx = document.getElementById('monthlyChart').getContext('2d');
    myChart = new Chart(ctx, {
      type: 'line',
      data: {
        labels: ['Mei', 'Jun', 'Jul', 'Agu', 'Sep'],
        datasets: [{
          label: 'Perkembangan Nilai Kuis',
          data: [65, 75, 80, 82, 88],
          borderColor: '#0095ff',
          backgroundColor: 'rgba(0, 149, 255, 0.1)',
          fill: true,
          tension: 0.4
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { display: false } }
      }
    });
  }
</script>
