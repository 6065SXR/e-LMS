  document.addEventListener("DOMContentLoaded", function() {
    checkUserSession();
  });

  function checkUserSession() {
    var savedUser = localStorage.getItem("elms_session");
    if (savedUser) {
      try {
        currentUser = JSON.parse(savedUser);
      } catch(e) {
        currentUser = null;
      }
    }
    
    if (currentUser) {
      document.getElementById("authOverlay").classList.add("hidden");
      updateUIForUser();
      loadDashboard();
      loadCourses(1);
    } else {
      document.getElementById("authOverlay").classList.remove("hidden");
    }
  }

  function toggleAuthMode(mode) {
    var loginCard = document.getElementById("loginCard");
    var regCard = document.getElementById("registerCard");

    if (mode === 'register') {
      loginCard.classList.add("hidden");
      regCard.classList.remove("hidden");
    } else {
      regCard.classList.add("hidden");
      loginCard.classList.remove("hidden");
    }
  }

  function handleLogin(e) {
    e.preventDefault();
    var email = document.getElementById("loginEmail").value;
    var pass = document.getElementById("loginPassword").value;
    var btn = document.getElementById("btnLoginSubmit");

    btn.disabled = true;
    btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin mr-2"></i> Memproses...';

    callBackend('loginUser', [email, pass], function(res) {
      btn.disabled = false;
      btn.innerHTML = 'Masuk Sekarang <i class="fa-solid fa-arrow-right-to-bracket ml-2"></i>';

      if (res.success) {
        currentUser = res.user;
        localStorage.setItem("elms_session", JSON.stringify(currentUser));
        document.getElementById("authOverlay").classList.add("hidden");
        showToast("Selamat datang kembali, " + currentUser.name);
        updateUIForUser();
        loadDashboard();
        loadCourses(1);
      } else {
        showToast(res.error);
      }
    });
  }

  function handleRegister(e) {
    e.preventDefault();
    var data = {
      nama: document.getElementById("regName").value,
      email: document.getElementById("regEmail").value,
      password: document.getElementById("regPassword").value,
      departemen: document.getElementById("regDept").value,
      site: document.getElementById("regSite").value

    var btn = document.getElementById("btnRegisterSubmit");
    btn.disabled = true;
    btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin mr-2"></i> Mengirim Link Otentikasi...';

    callBackend('registerUser', [data], function(res) {
      btn.disabled = false;
      btn.innerHTML = 'Register';

      if (res.success) {
        showToast(res.message);
        toggleAuthMode('login');
      } else {
        showToast("Gagal: " + res.error);
      }
    });
  }

  function logoutUser() {
    localStorage.removeItem("elms_session");

    document.getElementById("authOverlay").classList.remove("hidden");

  function handleRoleChange(isMobile) {
    var selector = isMobile ? document.getElementById("mobileRoleSelector") : document.getElementById("roleSelector");
    if (!selector) return;
    var newRole = selector.value;
    
    if (!currentUser) {
      currentUser = { user_id: 'USR-0003', name: 'Eko Tech Operator', role: newRole, email: 'eko.tech@datacenter.com', departemen: 'Operations', site: 'CGK1' };
    }

    currentUser.role = newRole;
    if (newRole === 'Super Admin') {
      currentUser.name = 'Admin Data Center';
      currentUser.user_id = 'USR-0001';
    } else if (newRole === 'Project Manager') {
      currentUser.name = 'Budi PM Infrastructure';
      currentUser.user_id = 'USR-0002';
    } else {
      currentUser.name = 'Eko Tech Operator';
      currentUser.user_id = 'USR-0003';
    }

    localStorage.setItem("elms_session", JSON.stringify(currentUser));
    updateUIForUser();
    loadDashboard();
    loadCourses(1);
    showToast("Beralih ke Peran: " + newRole);
  }

  function updateUIForUser() {
    if (!currentUser) return;
    document.getElementById("userNameDisplay").innerText = currentUser.name;
    document.getElementById("userRoleBadge").innerText = currentUser.role;

    var roleSelector = document.getElementById("roleSelector");
    if (roleSelector) roleSelector.value = currentUser.role;

    var mobileRoleSelector = document.getElementById("mobileRoleSelector");
    if (mobileRoleSelector) mobileRoleSelector.value = currentUser.role;

    var pmElems = document.querySelectorAll('.role-pm');
    var adminElems = document.querySelectorAll('.role-admin');

    pmElems.forEach(function(el) { el.classList.add('hidden'); });
    adminElems.forEach(function(el) { el.classList.add('hidden'); });

    if (currentUser.role === 'Project Manager') {
      pmElems.forEach(function(el) { el.classList.remove('hidden'); });
    } else if (currentUser.role === 'Super Admin') {
      pmElems.forEach(function(el) { el.classList.remove('hidden'); });
      adminElems.forEach(function(el) { el.classList.remove('hidden'); });
    }
  }

  function formatSecondsToMinSec(totalSeconds) {
    var sec = parseInt(totalSeconds, 10) || 0;
    if (sec <= 0) return "0 Menit";
    var m = Math.floor(sec / 60);
    var s = sec % 60;
    if (m === 0) return s + " Detik";
    if (s === 0) return m + " Menit";
    return m + "m " + s + "s";
  }

        '<i class="fa-solid fa-award text-amber-500"></i> <span>Tier III Certified</span>' +
      '</span>';
    }
    return '<span class="bg-gray-50 text-gray-400 px-2 py-0.5 rounded-full text-[10px] font-semibold">Junior Operator</span>';
  }

  function showToast(msg) {
    var toast = document.getElementById("toast");
    var toastMsg = document.getElementById("toastMsg");
    if (!toast || !toastMsg) return;
    toastMsg.innerText = msg;
    toast.classList.remove("hidden");
    setTimeout(function() { toast.classList.add("hidden"); }, 3500);
  }

  function switchTab(tabId) {
    var views = ['dashboard', 'katalog', 'karyawan', 'misi', 'users'];
    views.forEach(function(v) {
      var el = document.getElementById('view-' + v);
      var nav = document.getElementById('nav-' + v);
      var mNav = document.getElementById('mobile-nav-' + v);

      if (el) el.classList.add('hidden');
      if (nav) nav.classList.remove('active-nav');
      if (mNav) mNav.classList.remove('active-mobile-nav');
    });

    var activeEl = document.getElementById('view-' + tabId);
    var activeNav = document.getElementById('nav-' + tabId);
    var activeMNav = document.getElementById('mobile-nav-' + tabId);

    if (activeEl) activeEl.classList.remove('hidden');
    if (activeNav) activeNav.classList.add('active-nav');
    if (activeMNav) activeMNav.classList.add('active-mobile-nav');

    if (tabId === 'dashboard') loadDashboard();
    if (tabId === 'katalog') loadCourses(1);
    if (tabId === 'karyawan') loadEmployees();
    if (tabId === 'misi') loadMonthlyMissions();
    if (tabId === 'users') loadUsers();

  function renderCompetencyHeatmapTable(data) {
    var tbody = document.getElementById("heatmapTableBody");
    if (!tbody) return;
    tbody.innerHTML = "";

    var sites = data.sites || ["CGK1", "CGK2", "CGK3", "CGK3A", "CGK4"];
    var matrix = data.matrix || {};

    sites.forEach(function(s) {
      var tr = document.createElement("tr");
      tr.className = "hover:bg-blue-50/20 border-b border-gray-50 transition";

      var siteLabel = '<td class="py-3 px-3 font-bold text-navy flex items-center space-x-2"><i class="fa-solid fa-server text-teal-600"></i> <span>Site ' + s + '</span></td>';

      var pillars = ["cooling", "power", "safety", "network"];
      var cellsHtml = "";
      var hasRedOrYellow = false;
      var remedialPillar = "cooling";

      pillars.forEach(function(pId) {
        var pData = (matrix[s] && matrix[s][pId]) ? matrix[s][pId] : { avg: 85, risk: "green" };
        var badgeClass = "bg-emerald-50 text-emerald-600 border-emerald-200";

        if (pData.risk === "red") {
          badgeClass = "bg-rose-50 text-rose-600 border-rose-200 animate-pulse";
          hasRedOrYellow = true;
          remedialPillar = pId;
        } else if (pData.risk === "yellow") {
          badgeClass = "bg-amber-50 text-amber-600 border-amber-200";
          hasRedOrYellow = true;
          remedialPillar = pId;
        }

        cellsHtml += '<td class="py-3 px-3 text-center">' +
          '<span class="inline-block px-3 py-1 rounded-xl text-xs font-bold border ' + badgeClass + '">' + pData.avg + ' / 100</span>' +
          '</td>';
      });

      var actionBtn = hasRedOrYellow ?
        '<button type="button" onclick="executeRemedial(\'' + s + '\', \'' + remedialPillar + '\')" class="px-3 py-1.5 rounded-xl bg-rose-600 hover:bg-rose-700 text-white font-bold text-[11px] shadow transition flex items-center justify-center space-x-1 mx-auto"><i class="fa-solid fa-triangle-exclamation"></i> <span>Deploy Remedial</span></button>' :
        '<span class="text-emerald-600 font-bold text-xs flex items-center justify-center space-x-1"><i class="fa-solid fa-circle-check"></i> <span>Aman (SLA OK)</span></span>';

      tr.innerHTML = siteLabel + cellsHtml + '<td class="py-3 px-3 text-center">' + actionBtn + '</td>';
      tbody.appendChild(tr);
    });
  }

  function renderPerSiteChart(chartData) {
    var ctx = document.getElementById('monthlyChart');
    if (!ctx) return;

    if (myChart) {
      myChart.destroy();
    }

    var labels = (chartData && chartData.labels) ? chartData.labels : ['Site CGK1', 'Site CGK2', 'Site CGK3', 'Site CGK3A', 'Site CGK4'];
    var avgScores = (chartData && chartData.avgScores) ? chartData.avgScores : [85, 78, 90, 82, 75];
    var complianceRates = (chartData && chartData.complianceRates) ? chartData.complianceRates : [100, 50, 100, 50, 50];

    myChart = new Chart(ctx.getContext('2d'), {
      type: 'bar',
      data: {
        labels: labels,
        datasets: [
          {
            label: 'Rata-Rata Nilai Kuis',
            data: avgScores,
            backgroundColor: 'rgba(0, 149, 255, 0.85)',
            borderRadius: 8,
            barPercentage: 0.6
          },
          {
            label: 'Kepatuhan 2 Materi (%)',
            data: complianceRates,
            backgroundColor: 'rgba(46, 179, 150, 0.85)',
            borderRadius: 8,
            barPercentage: 0.6
          }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { display: true, position: 'top', labels: { font: { family: 'Plus Jakarta Sans', size: 11, weight: '600' } } }
        },
        scales: {
          y: { beginAtZero: true, max: 100, grid: { color: '#f1f5f9' } },
          x: { grid: { display: false } }
        }
      }
    });
  }

  function handleBulkUploadEmployee(e) {
    e.preventDefault();
    var fileInput = document.getElementById("csvFileInput");
    var file = fileInput.files[0];

    if (!file) {
      showToast("Harap pilih berkas CSV terlebih dahulu!");
      return;
    }

    var btn = document.getElementById("btnSubmitBulk");
    btn.disabled = true;
    btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin mr-1"></i> Memproses...';

    var reader = new FileReader();
    reader.onload = function(evt) {
      var csvText = evt.target.result;
      callBackend('bulkUploadEmployees', [csvText], function(res) {
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-cloud-arrow-up mr-1"></i> <span>Proses Upload</span>';

        if (res.success) {
          showToast(res.message);
          fileInput.value = "";
          closeBulkEmployeeModal();
          loadEmployees();
        } else {
          showToast("Gagal: " + res.error);
        }
      });
    };
    reader.readAsText(file);
  }

  function readFileAsBase64(file) {
    return new Promise(function(resolve, reject) {
      if (!file) {
        resolve(null);
        return;
      }
      var reader = new FileReader();
      reader.onload = function(e) {
        resolve({
          name: file.name,
          type: file.type,
          base64: e.target.result
        });
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  function convertToEmbedUrl(url) {
    if (!url || url === '#' || url.trim() === '') return '';
    var cleanUrl = url.trim();

    if (cleanUrl.indexOf('drive.google.com') !== -1) {
      var matchId = cleanUrl.match(/\/d\/([a-zA-Z0-9_-]+)/) || cleanUrl.match(/id=([a-zA-Z0-9_-]+)/);
      if (matchId && matchId[1]) {
        return 'https://drive.google.com/file/d/' + matchId[1] + '/preview';
      }
      if (cleanUrl.indexOf('/preview') !== -1) return cleanUrl;
      cleanUrl = cleanUrl.replace(/\/view(\?.*)?$/, '/preview');
      cleanUrl = cleanUrl.replace(/\/edit(\?.*)?$/, '/preview');
      if (cleanUrl.indexOf('/preview') === -1) {
        cleanUrl = cleanUrl.replace(/\?usp=.*$/, '') + '/preview';
      }
      return cleanUrl;
    }

    if (cleanUrl.indexOf('youtube.com') !== -1 || cleanUrl.indexOf('youtu.be') !== -1) {
      var ytMatch = cleanUrl.match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|watch\?.+&v=))([\w-]{11})/);
      if (ytMatch && ytMatch[1]) {
        return 'https://www.youtube.com/embed/' + ytMatch[1] + '?autoplay=1';
      }
    }

    return cleanUrl;
  }

  function submitQuizAnswers() {
    if (!currentQuizList || currentQuizList.length === 0) return;
    
    var correctCount = 0;
    var totalQuestions = currentQuizList.length;

    currentQuizList.forEach(function(q, idx) {
      var radios = document.getElementsByName('q_' + idx);
      var selectedVal = "";
      for (var r = 0; r < radios.length; r++) {
        if (radios[r].checked) {
          selectedVal = radios[r].value;
          break;
        }
      }
      if (selectedVal && selectedVal.toUpperCase() === (q.jawaban_benar || "A").toUpperCase()) {
        correctCount++;
      }
    });

    var score = Math.round((correctCount / totalQuestions) * 100);
    closeQuizModal();

    var uid = currentUser ? currentUser.user_id : 'USR-0003';
    callBackend('recordUserProgress', [{
      user_id: uid,
      course_id: activeCourseForQuiz,
      quiz_score: score,
      is_completed: score >= 80
    }], function(res) {
      showToast("Kuis Selesai! Skor Anda: " + score + " / 100. " + (score >= 80 ? "Selamat, Anda Lulus!" : "Silakan tingkatkan skor Anda."));
      loadDashboard();
      loadCourses(1);
    });
  }

                          '<button type="button" onclick="trackPdf(\'' + item.course_id + '\', \'' + safePdf + '\', \'' + safeTitle + '\', \'' + safeVideo + '\')" class="px-3 py-1.5 rounded-xl bg-red-50 text-red-500 hover:bg-red-100 text-xs font-bold transition flex items-center space-x-1"><i class="fa-solid fa-file-pdf"></i> <span>1. Baca SOP</span></button>' +
                          '<button type="button" onclick="trackVideo(\'' + item.course_id + '\', \'' + safeVideo + '\', \'' + safeTitle + '\', \'' + safePdf + '\')" class="px-3 py-1.5 rounded-xl bg-blue-50 text-blue-500 hover:bg-blue-100 text-xs font-bold transition flex items-center space-x-1"><i class="fa-solid fa-play"></i> <span>2. Nonton Video</span></button>' +
                          '<button type="button" onclick="openQuizModal(\'' + item.course_id + '\', \'' + safeTitle + '\')" class="btn-primary px-3 py-1.5 rounded-xl text-xs font-bold flex items-center space-x-1"><i class="fa-solid fa-pen-to-square"></i> <span>3. Kerjakan Kuis</span></button>' +
                        '</div>';

      container.appendChild(card);
    });
  }

  function renderAdminMissionView(res) {
    if (res.stats) {
      document.getElementById("statMsnTotal").innerText = res.stats.totalKaryawan;
      document.getElementById("statMsnSelesai").innerText = res.stats.selesai;
      document.getElementById("statMsnProses").innerText = res.stats.dalamProses;
      document.getElementById("statMsnBelum").innerText = res.stats.belumStart;
    }

    var tbody = document.getElementById("adminMissionTableBody");
    if (!tbody) return;
    tbody.innerHTML = "";

    if (!res.tableData || res.tableData.length === 0) {
      tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted-grey text-sm py-8">Belum ada data misi untuk periode ini.</td></tr>';
      return;
    }

    res.tableData.forEach(function(row, idx) {
      var tr = document.createElement("tr");
      tr.className = "hover:bg-blue-50/30 transition border-b border-gray-50";

      var badgeClass = row.status === "Completed" ? "bg-emerald-50 text-emerald-600" : (row.status === "In Progress" ? "bg-amber-50 text-amber-600" : "bg-rose-50 text-rose-600");

      tr.innerHTML = '<td class="py-3 px-3 text-center font-bold text-muted-grey text-xs">' + (idx + 1) + '</td>' +
                     '<td class="py-3 px-3"><div class="font-bold text-navy text-xs">' + row.nama_lengkap + '</div><div class="text-[10px] text-muted-grey">' + row.nik + '</div></td>' +
                     '<td class="py-3 px-3 text-center"><span class="bg-indigo-50 text-indigo-600 px-2.5 py-0.5 rounded-full text-[11px] font-bold">' + row.site + '</span></td>' +
                     '<td class="py-3 px-3 text-xs text-navy font-medium">' + row.materi_assigned + '</td>' +
                     '<td class="py-3 px-3 text-center font-bold text-xs text-navy">' + row.materi_selesai + ' / ' + row.target_materi + '</td>' +
                     '<td class="py-3 px-3 text-center"><span class="' + badgeClass + ' px-2.5 py-1 rounded-full text-[11px] font-bold">' + row.status + '</span></td>';

      tbody.appendChild(tr);
    });
  }

  function loadUsers() {
    callBackend('getUsersList', [], function(res) {
      if (res.success) {
        var tbody = document.getElementById("userTableBody");
        if (!tbody) return;
        tbody.innerHTML = "";
        res.data.forEach(function(u) {
          var verifiedBadge = u.is_verified === 'TRUE' ? 
            '<span class="bg-emerald-50 text-emerald-600 px-2 py-0.5 rounded-full text-xs font-semibold">Verified</span>' : 
            '<span class="bg-amber-50 text-amber-600 px-2 py-0.5 rounded-full text-xs font-semibold">Pending</span>';

          var tr = document.createElement("tr");
          tr.innerHTML = '<td class="py-2 px-2 font-bold">' + u.user_id + '</td>' +
                         '<td class="py-2 px-2">' + u.nama_lengkap + '</td>' +
                         '<td class="py-2 px-2 text-muted-grey">' + u.email + '</td>' +
                         '<td class="py-2 px-2"><span class="bg-blue-50 text-blue-600 px-2 py-0.5 rounded-full text-xs font-semibold">' + u.role + '</span></td>' +
                         '<td class="py-2 px-2 text-muted-grey">' + u.departemen + '</td>' +
                         '<td class="py-2 px-2 text-center">' + verifiedBadge + '</td>';
          tbody.appendChild(tr);
        });
      }
    });
  }

  function handleSearch() {
    loadCourses(1);
  }
</script>
