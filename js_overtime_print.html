    }
    return getKspsLogoSvgHtml();
  }

  function renderSignatureHtml(signatureData, defaultFallbackSvg) {
    if (signatureData && signatureData.indexOf("data:image") !== -1) {
      return '<img src="' + signatureData + '" class="sig-monochrome-black" style="max-height: 44px; max-width: 135px; object-fit: contain; margin: 0 auto; filter: grayscale(100%) contrast(300%) brightness(0); -webkit-filter: grayscale(100%) contrast(300%) brightness(0);" alt="Digital Signature" />';
    }
    return defaultFallbackSvg;
  }

  function formatTanggalIndo(dateStr) {
    if (!dateStr || dateStr === "-") return "-";
    var parts = String(dateStr).trim().split("-");
    if (parts.length === 3) {
      var y = parts[0];
      var m = parseInt(parts[1], 10);
      var d = parseInt(parts[2], 10);
      var namaBulan = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];
      if (m >= 1 && m <= 12 && !isNaN(d)) {
        return d + " " + namaBulan[m - 1] + " " + y;
      }
    }
    return dateStr;
  }

  function printOvertimePDF() {
    var dataset = (currentFilteredOvertimeCache && currentFilteredOvertimeCache.length > 0) ?

    if (!dataset || dataset.length === 0) {

      return;

  function buildDynamicReorderConfig() {
    var uid = currentUser ? currentUser.user_id : 'USR-0003';
    var userSlots = (currentAttendanceMap && currentAttendanceMap[uid]) ? currentAttendanceMap[uid] : {};

    docOrderMeta = {};

    // 1. Masukkan berkas dari Slot 1 jika terunggah
    if (userSlots["slot1"] && userSlots["slot1"].fileUrl && userSlots["slot1"].fileUrl !== "#") {
      docOrderMeta["slot1"] = {
        title: "Form Absensi (PDF Utama)",
        desc: "Berkas scan absensi wajib karyawan (" + (userSlots["slot1"].fileName || "Absensi.pdf") + ")",
        icon: "fa-solid fa-file-invoice text-violet-600"
      };
      docPrintOrder.push("slot1");
    }

  function renderPdfPageToImage(pdfDoc, pageNum) {
    return new Promise(function(resolve) {
      pdfDoc.getPage(pageNum).then(function(page) {
        var viewport = page.getViewport({ scale: 2.0 });
        var canvas = document.createElement("canvas");
        var ctx = canvas.getContext("2d");
        canvas.height = viewport.height;
        canvas.width = viewport.width;

        var renderContext = {
          canvasContext: ctx,
          viewport: viewport
        };

        page.render(renderContext).promise.then(function() {
          resolve(canvas.toDataURL("image/png"));
        }).catch(function(err) {
          console.warn("Render page " + pageNum + " failed: ", err);
          resolve(null);
        });
      }).catch(function(err) {
        console.warn("Get page " + pageNum + " failed: ", err);
        resolve(null);
      });
    });
  }

      callBackend('getAllAttendancePdfsBase64', [targetUid, periodVal], function(res) {
        var filesList = (res && res.success && res.files) ? res.files : [];

        if (filesList.length > 0 && window.pdfjsLib) {
          var slotImagesMap = {};
          var processFilePromises = filesList.map(function(fileItem) {
            return new Promise(function(fileResolve) {
              try {
                var raw = window.atob(fileItem.base64);
                var rawLength = raw.length;
                var array = new Uint8Array(new ArrayBuffer(rawLength));
                for (var i = 0; i < rawLength; i++) {
                  array[i] = raw.charCodeAt(i);
                }

                pdfjsLib.getDocument({ data: array }).promise.then(function(pdfDoc) {
                  var pagePromises = [];
                  for (var p = 1; p <= pdfDoc.numPages; p++) {
                    pagePromises.push(renderPdfPageToImage(pdfDoc, p));

      var singleEmpSigHtml = renderSignatureHtml(item.user_signature || userSig, '<svg viewBox="0 0 100 40" style="height: 40px;"><path d="M10,25 Q30,5 40,25 T70,10 T90,30" fill="none" stroke="#000" stroke-width="2"/></svg>');

        '<td>Mengetahui Atasan Langsung<br><div class="stl-signature-box">' + itemPmSigHtml + '</div><span style="text-decoration: underline; font-weight: bold;">' + itemPmApproverName + '</span><br>NIK: ' + itemPmNik + '</td>' +

        '<tr><td>NIK</td><td>:</td><td>' + itemEmpNik + '</td></tr>' +

      '.kjk-info-table td { padding: 3px 0; }' +

    var printWindow = preOpenedWindow;
    if (!printWindow || printWindow.closed) {
      printWindow = window.open('', '_blank', 'width=900,height=850');

    if (printWindow) {
      printWindow.document.open();
      printWindow.document.write(fullCombinedHtml);
      printWindow.document.title = "";
      printWindow.document.close();
      setTimeout(function() { 
        try {
          printWindow.document.title = "";
          printWindow.focus();
          printWindow.print();
