<selection-tag><script>
  /**
   * ============================================================================
   * MODUL: KALKULASI & REKAP UPAH LEMBUR (PP 35/2021) & REKAP KJK (FLAT 2X)
   * System: e-LMS Data Center KSPS
   * Responsibility:
   * 1. Sub-Tab Switcher antara Rekap Lembur (PP35) & Rekap KJK (Flat 2x).
   * 2. Presisi matematika identik 100% dengan acuan Excel.
   * 3. Otomatisasi Simpan Realtime ke Spreadsheet (Sheet REKAP_LEMBUR & REKAP_KJK).
   * 4. PAGINASI TABEL: Pembatasan maksimal 10 data per halaman.
   * ============================================================================
   */

  var currentCalcSubTab = 'pp35'; // 'pp35' atau 'kjk'

  // STATE REKAP LEMBUR PP35
  var currentCalcRawList = [];
  var currentProcessedCalcList = [];
  var calcCurrentPage = 1;
  var calcPageSize = 10;

  // STATE REKAP KJK FLAT 2X
  var currentKjkRawList = [];
  var currentProcessedKjkList = [];
  var kjkCurrentPage = 1;
  var kjkPageSize = 10;

  function UtilitiesFormatDateMonth() {
    var d = new Date();
    var month = ('0' + (d.getMonth() + 1)).slice(-2);
    return d.getFullYear() + '-' + month;
  }

  function ensureXlsxLibrary(callback) {
    if (window.XLSX) {
      callback(true);
      return;
    }
    var script = document.createElement("script");
    script.src = "https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js";
    script.onload = function() { callback(true); };
    script.onerror = function() { callback(false); };
    document.head.appendChild(script);
  }

  function switchCalcSubTab(targetTab) {
    currentCalcSubTab = targetTab || 'pp35';

    var btnPp35 = document.getElementById("btnSubTabPp35");
    var btnKjk = document.getElementById("btnSubTabKjk");
    var labelHoursCard = document.getElementById("calcSumHoursCardLabel");
    var tableHeaderEl = document.getElementById("calcTableHeaderRow");

    var periodFilter = document.getElementById("calcPeriodFilter");
    if (periodFilter && (!periodFilter.value || periodFilter.value.trim() === "")) {
      periodFilter.value = UtilitiesFormatDateMonth();
    }

    if (currentCalcSubTab === 'kjk') {
      if (btnPp35) btnPp35.className = "px-4 py-2 rounded-xl text-xs font-bold transition text-slate-600 hover:text-slate-900 cursor-pointer";
      if (btnKjk) btnKjk.className = "px-4 py-2 rounded-xl text-xs font-bold transition bg-amber-600 text-white shadow-xs cursor-pointer";
      if (labelHoursCard) labelHoursCard.innerText = "JAM KJK (INDEKS 2X)";

      if (tableHeaderEl) {
        tableHeaderEl.innerHTML = '<th class="py-3 px-3 text-center">NO</th>' +
          '<th class="py-3 px-3">NAMA KARYAWAN & NIK</th>' +
          '<th class="py-3 px-3 text-center">SITE</th>' +
          '<th class="py-3 px-3 text-center">PERIODE BULAN</th>' +
          '<th class="py-3 px-3 text-center">JAM KJK (RAW)</th>' +
          '<th class="py-3 px-3 text-center">JAM INDEKS (2X)</th>' +
          '<th class="py-3 px-3 text-right">BASIC SALARY</th>' +
          '<th class="py-3 px-3 text-right">UPAH/JAM</th>' +
          '<th class="py-3 px-3 text-right">TOTAL NOMINAL KJK</th>' +
          '<th class="py-3 px-3 text-center">STATUS SYNC</th>';
      }

      loadKjkCalculationData();
    } else {
      if (btnPp35) btnPp35.className = "px-4 py-2 rounded-xl text-xs font-bold transition bg-[#1C1B8E] text-white shadow-xs cursor-pointer";
      if (btnKjk) btnKjk.className = "px-4 py-2 rounded-xl text-xs font-bold transition text-slate-600 hover:text-slate-900 cursor-pointer";
      if (labelHoursCard) labelHoursCard.innerText = "JAM EFEKTIF";

      if (tableHeaderEl) {
        tableHeaderEl.innerHTML = '<th class="py-3 px-3 text-center">NO</th>' +
          '<th class="py-3 px-3">NAMA KARYAWAN & NIK</th>' +
          '<th class="py-3 px-3 text-center">SITE</th>' +
          '<th class="py-3 px-3 text-center">TANGGAL</th>' +
          '<th class="py-3 px-3 text-center">TIPE HARI</th>' +
          '<th class="py-3 px-3 text-center">JAM KOTOR</th>' +
          '<th class="py-3 px-3 text-center">POT. ISTIRAHAT</th>' +
          '<th class="py-3 px-3 text-center">JAM EFEKTIF</th>' +
          '<th class="py-3 px-3 text-center">BOBOT RATE</th>' +
          '<th class="py-3 px-3 text-right">UPAH/JAM</th>' +
          '<th class="py-3 px-3 text-right">TOTAL NOMINAL</th>' +
          '<th class="py-3 px-3 text-center">STATUS SYNC</th>';
      }

      loadOvertimeCalculationData();
    }
  }

  function isIndonesianHolidayFrontend(dateStr) {
    if (!dateStr) return false;
    var holidays = [
      "-01-01", "-05-01", "-06-01", "-08-17", "-12-25",
      "2025-01-27", "2025-01-29", "2025-03-29", "2025-03-31", "2025-04-01",
      "2025-04-18", "2025-05-12", "2025-05-29", "2025-06-06", "2025-06-27", "2025-09-05",
      "2026-01-16", "2026-02-17", "2026-03-19", "2026-03-20", "2026-03-21",
      "2026-04-03", "2026-05-14", "2026-05-27", "2026-05-31", "2026-06-16", "2026-08-25",
      "2027-02-05", "2027-02-06", "2027-03-09", "2027-03-10", "2027-03-26",
      "2027-05-06", "2027-05-16", "2027-05-20", "2027-06-06"
    ];
    var datePart = dateStr.length >= 10 ? dateStr.substring(0, 10) : dateStr;
    var monthDay = datePart.length >= 10 ? datePart.substring(4) : "";
    return holidays.indexOf(datePart) !== -1 || holidays.indexOf(monthDay) !== -1;
  }

  function determineAutoDayTypeFrontend(dateStr) {
    if (!dateStr) return "Workday";
    var d = new Date(dateStr + "T00:00:00");
    var dayOfWeek = d.getDay();
    if (dayOfWeek === 0 || dayOfWeek === 6 || isIndonesianHolidayFrontend(dateStr)) {
      return "Day Off";
    }
    return "Workday";
  }

  function loadOvertimeCalculationData() {
    var periodFilter = document.getElementById("calcPeriodFilter");
    var periodVal = periodFilter ? periodFilter.value : UtilitiesFormatDateMonth();

    var siteFilter = document.getElementById("calcSiteFilter");
    var siteVal = siteFilter ? siteFilter.value : "ALL";

    showToast("Mengambil data lembur PP35...");

    callBackend('getApprovedOvertimeForCalculation', [periodVal, siteVal], function(res) {
      if (!res || !res.success) {
        showToast(res ? res.error : "Gagal memuat data lembur.");
        return;
      }

      currentCalcRawList = res.data || [];
      calcCurrentPage = 1;

      populateCalcEmployeeDropdown(currentCalcRawList);
      renderOvertimeCalculationTable();
    });
  }

  function loadKjkCalculationData() {
    var periodFilter = document.getElementById("calcPeriodFilter");
    var periodVal = periodFilter ? periodFilter.value : UtilitiesFormatDateMonth();

    var siteFilter = document.getElementById("calcSiteFilter");
    var siteVal = siteFilter ? siteFilter.value : "ALL";

    showToast("Mengambil data KJK...");

    callBackend('getApprovedKjkForCalculation', [periodVal, siteVal], function(res) {
      if (!res || !res.success) {
        showToast(res ? res.error : "Gagal memuat data KJK.");
        return;
      }

      currentKjkRawList = res.data || [];
      kjkCurrentPage = 1;

      populateCalcEmployeeDropdown(currentKjkRawList);
      renderKjkCalculationTable();
    });
  }

  function populateCalcEmployeeDropdown(dataList) {
    var empSelect = document.getElementById("calcEmployeeFilter");
    if (!empSelect) return;

    var currentVal = empSelect.value || "ALL";
    empSelect.innerHTML = '<option value="ALL">Semua Karyawan</option>';

    var seenUsers = {};
    (dataList || []).forEach(function(item) {
      if (!seenUsers[item.user_id]) {
        seenUsers[item.user_id] = true;
        var opt = document.createElement("option");
        opt.value = item.user_id;
        opt.innerText = item.nama_lengkap + " (" + item.site + ")";
        empSelect.appendChild(opt);
      }
    });

    var exists = Array.from(empSelect.options).some(function(o) { return o.value === currentVal; });
    empSelect.value = exists ? currentVal : "ALL";
  }

  function handleCalcFilterChange() {
    if (currentCalcSubTab === 'kjk') {
      kjkCurrentPage = 1;
      loadKjkCalculationData();
    } else {
      calcCurrentPage = 1;
      loadOvertimeCalculationData();
    }
  }

  function handleCalcEmployeeFilterChange() {
    if (currentCalcSubTab === 'kjk') {
      kjkCurrentPage = 1;
      loadKjkCalculationData();
    } else {
      calcCurrentPage = 1;
      loadOvertimeCalculationData();
    }
  }

  function calculatePP35Single(rawHours, overtimeType, wageBase) {
    var exactHourlyWage = wageBase / 173;
    var displayHourlyWage = Math.round(exactHourlyWage);

    var restDeduction = 0;
    var effectiveHours = Math.round(rawHours * 10) / 10;

    var rateHours = 0;
    if (overtimeType === 'Workday') {
      if (effectiveHours <= 1) {
        rateHours = effectiveHours * 1.5;
      } else {
        rateHours = 1.5 + ((effectiveHours - 1) * 2.0);
      }
    } else {
      if (effectiveHours <= 8) {
        rateHours = effectiveHours * 2.0;
      } else if (effectiveHours <= 9) {
        rateHours = 16.0 + ((effectiveHours - 8) * 3.0);
      } else {
        rateHours = 19.0 + ((effectiveHours - 9) * 4.0);
      }
    }

    rateHours = Math.round(rateHours * 10) / 10;
    var overtimeAmount = Math.round(rateHours * exactHourlyWage);

    return {
      hourly_wage: displayHourlyWage,
      rest_deduction: restDeduction,
      effective_hours: effectiveHours,
      rate_hours: rateHours,
      overtime_amount: overtimeAmount
    };
  }

  function calculateKjkSingle(hours, wageBase) {
    var exactHourlyWage = wageBase / 173;
    var displayHourlyWage = Math.round(exactHourlyWage);

    var hoursIndex = Math.round(hours * 2 * 10) / 10;
    var kjkAmount = Math.round(hoursIndex * exactHourlyWage);

    return {
      hours_index: hoursIndex,
      hourly_wage: displayHourlyWage,
      kjk_amount: kjkAmount
    };
  }

  function renderOvertimeCalculationTable() {
    var tbody = document.getElementById("rekapLemburTableBody");
    if (!tbody) return;
    tbody.innerHTML = "";

    var empFilterVal = document.getElementById("calcEmployeeFilter") ? document.getElementById("calcEmployeeFilter").value : "ALL";

    var filteredList = currentCalcRawList.filter(function(item) {
      return (empFilterVal === "ALL" || item.user_id === empFilterVal);
    });

    if (filteredList.length === 0) {
      tbody.innerHTML = '<tr><td colspan="12" class="text-center text-slate-500 text-sm py-8">Tidak ada data lembur berstatus Approved yang ditemukan.</td></tr>';
      updateCalcSummaryBadges(0, 0, 0);
      renderCalcPaginationControls(0, 0);
      currentProcessedCalcList = [];
      return;
    }

    currentProcessedCalcList = [];
    var totalEmpCount = new Set();
    var totalEffectiveHours = 0;
    var totalNominalAmountCombined = 0;

    filteredList.forEach(function(item) {
      var autoType = determineAutoDayTypeFrontend(item.tanggal);
      var calcRes = calculatePP35Single(item.raw_hours, autoType, item.wage_base);

      var processedItem = Object.assign({}, item, {
        overtime_type: autoType,
        hourly_wage: calcRes.hourly_wage,
        rest_deduction: calcRes.rest_deduction,
        effective_hours: calcRes.effective_hours,
        rate_hours: calcRes.rate_hours,
        overtime_amount: calcRes.overtime_amount
      });

      currentProcessedCalcList.push(processedItem);

      totalEmpCount.add(item.user_id);
      totalEffectiveHours += calcRes.effective_hours;
      totalNominalAmountCombined += calcRes.overtime_amount;
    });

    updateCalcSummaryBadges(totalEmpCount.size, Math.round(totalEffectiveHours * 10) / 10, totalNominalAmountCombined);

    var totalItems = currentProcessedCalcList.length;
    var totalPages = Math.ceil(totalItems / calcPageSize) || 1;

    if (calcCurrentPage > totalPages) calcCurrentPage = totalPages;
    if (calcCurrentPage < 1) calcCurrentPage = 1;

    var startIdx = (calcCurrentPage - 1) * calcPageSize;
    var endIdx = Math.min(startIdx + calcPageSize, totalItems);
    var pagedList = currentProcessedCalcList.slice(startIdx, endIdx);

    pagedList.forEach(function(item, idx) {
      var rowNumber = startIdx + idx + 1;
      var tr = document.createElement("tr");
      tr.className = "hover:bg-slate-50 transition border-b border-slate-100 text-xs";

      var typeBadgeHtml = item.overtime_type === 'Day Off' ?
        '<span class="px-2.5 py-1 rounded-lg text-[11px] font-bold bg-amber-100/80 text-amber-900 border border-amber-300/80 inline-flex items-center shadow-2xs"><i class="fa-solid fa-calendar-day mr-1 text-amber-700"></i> Day Off (Libur)</span>' :
        '<span class="px-2.5 py-1 rounded-lg text-[11px] font-bold bg-slate-100 text-slate-700 border border-slate-200 inline-flex items-center"><i class="fa-solid fa-briefcase mr-1 text-slate-500"></i> Workday (Kerja)</span>';

      var statusSyncBadge = '<span class="bg-emerald-50 text-emerald-700 border border-emerald-200 px-2.5 py-0.5 rounded-full text-[10px] font-bold inline-flex items-center"><i class="fa-solid fa-check mr-1"></i>Tersimpan</span>';

      tr.innerHTML = '<td class="py-3 px-3 text-center font-bold text-slate-500">' + rowNumber + '</td>' +
        '<td class="py-3 px-3"><div class="font-bold text-slate-900">' + item.nama_lengkap + '</div><div class="text-[10px] font-mono text-slate-500">' + item.nik + '</div></td>' +
        '<td class="py-3 px-3 text-center"><span class="bg-indigo-50 text-[#1C1B8E] px-2 py-0.5 rounded-full text-[11px] font-bold border border-indigo-100">' + item.site + '</span></td>' +
        '<td class="py-3 px-3 text-center font-bold text-slate-800 whitespace-nowrap">' + item.tanggal + '</td>' +
        '<td class="py-3 px-3 text-center">' + typeBadgeHtml + '</td>' +
        '<td class="py-3 px-3 text-center font-bold text-slate-700">' + item.raw_hours + ' Jam</td>' +
        '<td class="py-3 px-3 text-center font-semibold text-rose-600 bg-rose-50/50">' + item.rest_deduction + ' Jam</td>' +
        '<td class="py-3 px-3 text-center font-extrabold text-[#1C1B8E] bg-indigo-50/30">' + item.effective_hours + ' Jam</td>' +
        '<td class="py-3 px-3 text-center font-bold text-amber-800 bg-amber-50/30">' + item.rate_hours + ' Rate</td>' +
        '<td class="py-3 px-3 text-right font-mono font-medium text-slate-600">Rp ' + item.hourly_wage.toLocaleString('id-ID') + '</td>' +
        '<td class="py-3 px-3 text-right font-mono font-extrabold text-emerald-700 bg-emerald-50/40">Rp ' + item.overtime_amount.toLocaleString('id-ID') + '</td>' +
        '<td class="py-3 px-3 text-center">' + statusSyncBadge + '</td>';

      tbody.appendChild(tr);
    });

    renderCalcPaginationControls(totalItems, totalPages);
  }

  function renderKjkCalculationTable() {
    var tbody = document.getElementById("rekapLemburTableBody");
    if (!tbody) return;
    tbody.innerHTML = "";

    var empFilterVal = document.getElementById("calcEmployeeFilter") ? document.getElementById("calcEmployeeFilter").value : "ALL";

    var filteredList = currentKjkRawList.filter(function(item) {
      return (empFilterVal === "ALL" || item.user_id === empFilterVal);
    });

    if (filteredList.length === 0) {
      tbody.innerHTML = '<tr><td colspan="10" class="text-center text-slate-500 text-sm py-8">Tidak ada data KJK yang ditemukan.</td></tr>';
      updateCalcSummaryBadges(0, 0, 0);
      renderCalcPaginationControls(0, 0);
      currentProcessedKjkList = [];
      return;
    }

    currentProcessedKjkList = [];
    var totalEmpCount = new Set();
    var totalHoursIndex = 0;
    var totalKjkAmount = 0;

    filteredList.forEach(function(item) {
      var calcRes = calculateKjkSingle(item.hours, item.wage_base);

      var processedItem = Object.assign({}, item, {
        hours_index: calcRes.hours_index,
        hourly_wage: calcRes.hourly_wage,
        kjk_amount: calcRes.kjk_amount
      });

      currentProcessedKjkList.push(processedItem);

      totalEmpCount.add(item.user_id);
      totalHoursIndex += calcRes.hours_index;
      totalKjkAmount += calcRes.kjk_amount;
    });

    updateCalcSummaryBadges(totalEmpCount.size, Math.round(totalHoursIndex * 10) / 10, totalKjkAmount);

    var totalItems = currentProcessedKjkList.length;
    var totalPages = Math.ceil(totalItems / kjkPageSize) || 1;

    if (kjkCurrentPage > totalPages) kjkCurrentPage = totalPages;
    if (kjkCurrentPage < 1) kjkCurrentPage = 1;

    var startIdx = (kjkCurrentPage - 1) * kjkPageSize;
    var endIdx = Math.min(startIdx + kjkPageSize, totalItems);
    var pagedList = currentProcessedKjkList.slice(startIdx, endIdx);

    pagedList.forEach(function(item, idx) {
      var rowNumber = startIdx + idx + 1;
      var tr = document.createElement("tr");
      tr.className = "hover:bg-slate-50 transition border-b border-slate-100 text-xs";

      var statusSyncBadge = '<span class="bg-emerald-50 text-emerald-700 border border-emerald-200 px-2.5 py-0.5 rounded-full text-[10px] font-bold inline-flex items-center"><i class="fa-solid fa-check mr-1"></i>Tersimpan</span>';

      tr.innerHTML = '<td class="py-3 px-3 text-center font-bold text-slate-500">' + rowNumber + '</td>' +
        '<td class="py-3 px-3"><div class="font-bold text-slate-900">' + item.nama_lengkap + '</div><div class="text-[10px] font-mono text-slate-500">' + item.nik + '</div></td>' +
        '<td class="py-3 px-3 text-center"><span class="bg-amber-50 text-amber-800 px-2 py-0.5 rounded-full text-[11px] font-bold border border-amber-200">' + item.site + '</span></td>' +
        '<td class="py-3 px-3 text-center font-bold text-slate-800 whitespace-nowrap">' + (item.bulan || item.periode) + '</td>' +
        '<td class="py-3 px-3 text-center font-bold text-slate-700">' + item.hours + ' Jam</td>' +
        '<td class="py-3 px-3 text-center font-extrabold text-amber-700 bg-amber-50/40">' + item.hours_index + ' Jam (2x)</td>' +
        '<td class="py-3 px-3 text-right font-mono text-slate-600">Rp ' + item.wage_base.toLocaleString('id-ID') + '</td>' +
        '<td class="py-3 px-3 text-right font-mono font-medium text-slate-600">Rp ' + item.hourly_wage.toLocaleString('id-ID') + '</td>' +
        '<td class="py-3 px-3 text-right font-mono font-extrabold text-emerald-700 bg-emerald-50/40">Rp ' + item.kjk_amount.toLocaleString('id-ID') + '</td>' +
        '<td class="py-3 px-3 text-center">' + statusSyncBadge + '</td>';

      tbody.appendChild(tr);
    });

    renderCalcPaginationControls(totalItems, totalPages);
  }

  function renderCalcPaginationControls(totalItems, totalPages) {
    var infoEl = document.getElementById("calcPaginationInfo");
    var controlsEl = document.getElementById("calcPaginationControls");

    if (!infoEl || !controlsEl) return;

    if (totalItems === 0) {
      infoEl.innerText = "Menampilkan 0 dari 0 data";
      controlsEl.innerHTML = "";
      return;
    }

    var currentPage = currentCalcSubTab === 'kjk' ? kjkCurrentPage : calcCurrentPage;

    var startNum = (currentPage - 1) * calcPageSize + 1;
    var endNum = Math.min(currentPage * calcPageSize, totalItems);
    infoEl.innerText = "Menampilkan " + startNum + " - " + endNum + " dari " + totalItems + " data";

    var controlsHtml = "";

    if (currentPage > 1) {
      controlsHtml += '<button type="button" onclick="changeCalcPage(' + (currentPage - 1) + ')" class="px-3 py-1.5 rounded-lg text-xs font-bold bg-white text-slate-700 border border-slate-200 hover:bg-slate-100 transition cursor-pointer"><i class="fa-solid fa-chevron-left mr-1"></i>Prev</button>';
    } else {
      controlsHtml += '<button type="button" disabled class="px-3 py-1.5 rounded-lg text-xs font-bold bg-slate-100 text-slate-400 border border-slate-200 cursor-not-allowed"><i class="fa-solid fa-chevron-left mr-1"></i>Prev</button>';
    }

    for (var p = 1; p <= totalPages; p++) {
      if (p === currentPage) {
        controlsHtml += '<button type="button" class="px-3 py-1.5 rounded-lg text-xs font-bold bg-[#1C1B8E] text-white shadow-xs cursor-default">' + p + '</button>';
      } else {
        if (p === 1 || p === totalPages || (p >= currentPage - 1 && p <= currentPage + 1)) {
          controlsHtml += '<button type="button" onclick="changeCalcPage(' + p + ')" class="px-3 py-1.5 rounded-lg text-xs font-bold bg-white text-slate-700 border border-slate-200 hover:bg-slate-100 transition cursor-pointer">' + p + '</button>';
        } else if (p === currentPage - 2 || p === currentPage + 2) {
          controlsHtml += '<span class="px-1 text-slate-400 font-bold">...</span>';
        }
      }
    }

    if (currentPage < totalPages) {
      controlsHtml += '<button type="button" onclick="changeCalcPage(' + (currentPage + 1) + ')" class="px-3 py-1.5 rounded-lg text-xs font-bold bg-white text-slate-700 border border-slate-200 hover:bg-slate-100 transition cursor-pointer">Next<i class="fa-solid fa-chevron-right ml-1"></i></button>';
    } else {
      controlsHtml += '<button type="button" disabled class="px-3 py-1.5 rounded-lg text-xs font-bold bg-slate-100 text-slate-400 border border-slate-200 cursor-not-allowed">Next<i class="fa-solid fa-chevron-right ml-1"></i></button>';
    }

    controlsEl.innerHTML = controlsHtml;
  }

  function changeCalcPage(newPage) {
    if (currentCalcSubTab === 'kjk') {
      kjkCurrentPage = newPage;
      renderKjkCalculationTable();
    } else {
      calcCurrentPage = newPage;
      renderOvertimeCalculationTable();
    }
  }

  function updateCalcSummaryBadges(empCount, effectiveHours, totalAmountCombined) {
    var empEl = document.getElementById("calcSumTotalEmployees");
    var hrsEl = document.getElementById("calcSumTotalHours");
    var amtEl = document.getElementById("calcSumTotalAmount");

    if (empEl) empEl.innerText = empCount + " Orang";
    if (hrsEl) hrsEl.innerText = effectiveHours + " Jam";
    if (amtEl) amtEl.innerText = "Rp " + totalAmountCombined.toLocaleString('id-ID');
  }

  function handleExportRekapExcel() {
    var isKjk = (currentCalcSubTab === 'kjk');
    var activeList = isKjk ? currentProcessedKjkList : currentProcessedCalcList;

    if (!activeList || activeList.length === 0) {
      showToast("Tidak ada data untuk diekspor!");
      return;
    }

    var periodFilter = document.getElementById("calcPeriodFilter");
    var periodVal = periodFilter ? periodFilter.value : UtilitiesFormatDateMonth();

    ensureXlsxLibrary(function(loaded) {
      if (!loaded || !window.XLSX) {
        showToast("Gagal memuat library Excel Spreadsheet.");
        return;
      }

      var aoaData = [];
      var fileName = "";

      if (isKjk) {
        fileName = "Rekap_KJK_Flat2x_" + periodVal + ".xlsx";
        aoaData = [
          ["REKAPITULASI KELEBIHAN JAM KERJA (KJK - FLAT MULTIPLIER 2X)"],
          ["Periode: " + periodVal],
          ["Tanggal Ekspor: " + new Date().toLocaleString('id-ID')],
          [""],
          ["NO", "NIK", "NAMA LENGKAP", "SITE", "PERIODE BULAN", "JAM KJK", "JAM INDEKS (2X)", "BASIC SALARY (RP)", "UPAH/JAM (RP)", "TOTAL NOMINAL KJK (RP)"]
        ];

        activeList.forEach(function(item, idx) {
          aoaData.push([
            (idx + 1),
            item.nik || "-",
            String(item.nama_lengkap || "").toUpperCase(),
            item.site || "CGK1",
            item.bulan || item.periode || "-",
            item.hours,
            item.hours_index,
            item.wage_base,
            item.hourly_wage,
            item.kjk_amount
          ]);
        });
      } else {
        fileName = "Rekap_Upah_Lembur_PP35_" + periodVal + ".xlsx";
        aoaData = [
          ["REKAPITULASI UPAH LEMBUR KARYAWAN (PP NO. 35 TAHUN 2021)"],
          ["Periode: " + periodVal],
          ["Tanggal Ekspor: " + new Date().toLocaleString('id-ID')],
          [""],
          ["NO", "NIK", "NAMA LENGKAP", "SITE", "TANGGAL", "TIPE HARI", "JAM KOTOR", "POT. ISTIRAHAT", "JAM EFEKTIF", "BOBOT RATE", "UPAH/JAM (RP)", "TOTAL LEMBUR (RP)"]
        ];

        activeList.forEach(function(item, idx) {
          aoaData.push([
            (idx + 1),
            item.nik || "-",
            String(item.nama_lengkap || "").toUpperCase(),
            item.site || "CGK1",
            item.tanggal || "-",
            item.overtime_type,
            item.raw_hours,
            item.rest_deduction,
            item.effective_hours,
            item.rate_hours,
            item.hourly_wage,
            item.overtime_amount
          ]);
        });
      }

      var ws = XLSX.utils.aoa_to_sheet(aoaData);
      var wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, isKjk ? "Rekap KJK" : "Rekap Lembur PP35");

      XLSX.writeFile(wb, fileName);
      showToast("Berkas " + fileName + " berhasil diunduh!");
    });
  }
</script></selection-tag>
