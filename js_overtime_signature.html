<script>
  /**
   * Sub-modul Digital Signature Pad (Canvas & Upload)
   * System: e-LMS Data Center KSPS
   * Update: Memaksa warna tinta hitam pekat & integrasi update TTD PM
   */

  var activeSigMode = "draw"; // 'draw' atau 'upload'
  var isDrawing = false;
  var sigCanvasContext = null;
  var uploadedSignatureBase64 = null;

  document.addEventListener("DOMContentLoaded", function() {
    initSignatureCanvas();
  });

  function initSignatureCanvas() {
    var canvas = document.getElementById("sigCanvas");
    if (!canvas) return;
    sigCanvasContext = canvas.getContext("2d");

    // Mengunci warna pena menjadi hitam pekat (#000000)
    sigCanvasContext.strokeStyle = "#000000";
    sigCanvasContext.lineWidth = 2.5;
    sigCanvasContext.lineCap = "round";
    sigCanvasContext.lineJoin = "round";

    // Mouse Events
    canvas.addEventListener("mousedown", startDrawing);
    canvas.addEventListener("mousemove", draw);
    canvas.addEventListener("mouseup", stopDrawing);
    canvas.addEventListener("mouseleave", stopDrawing);

    // Touch Events (Smartphone & Tablet)
    canvas.addEventListener("touchstart", function(e) {
      e.preventDefault();
      var touch = e.touches[0];
      var mouseEvent = new MouseEvent("mousedown", {
        clientX: touch.clientX,
        clientY: touch.clientY
      });
      canvas.dispatchEvent(mouseEvent);
    }, { passive: false });

    canvas.addEventListener("touchmove", function(e) {
      e.preventDefault();
      var touch = e.touches[0];
      var mouseEvent = new MouseEvent("mousemove", {
        clientX: touch.clientX,
        clientY: touch.clientY
      });
      canvas.dispatchEvent(mouseEvent);
    }, { passive: false });

    canvas.addEventListener("touchend", function(e) {
      e.preventDefault();
      var mouseEvent = new MouseEvent("mouseup", {});
      canvas.dispatchEvent(mouseEvent);
    }, { passive: false });
  }

  function getCanvasCoordinates(e) {
    var canvas = document.getElementById("sigCanvas");
    var rect = canvas.getBoundingClientRect();
    return {
      x: e.clientX - rect.left,
      y: e.clientY - rect.top
    };
  }

  function startDrawing(e) {
    isDrawing = true;
    var coords = getCanvasCoordinates(e);
    sigCanvasContext.beginPath();
    sigCanvasContext.moveTo(coords.x, coords.y);
    var placeholder = document.getElementById("sigPlaceholderText");
    if (placeholder) placeholder.classList.add("hidden");
  }

  function draw(e) {
    if (!isDrawing) return;
    var coords = getCanvasCoordinates(e);
    sigCanvasContext.lineTo(coords.x, coords.y);
    sigCanvasContext.stroke();
  }

  function stopDrawing() {
    if (isDrawing) {
      sigCanvasContext.closePath();
      isDrawing = false;
    }
  }

  function clearSignatureCanvas() {
    var canvas = document.getElementById("sigCanvas");
    if (!canvas || !sigCanvasContext) return;
    sigCanvasContext.clearRect(0, 0, canvas.width, canvas.height);
    var placeholder = document.getElementById("sigPlaceholderText");
    if (placeholder) placeholder.classList.remove("hidden");
  }

  function switchSigTab(mode) {
    activeSigMode = mode;
    var drawContainer = document.getElementById("sigDrawContainer");
    var uploadContainer = document.getElementById("sigUploadContainer");
    var tabDrawBtn = document.getElementById("tabSigDrawBtn");
    var tabUploadBtn = document.getElementById("tabSigUploadBtn");

    if (mode === 'draw') {
      drawContainer.classList.remove("hidden");
      uploadContainer.classList.add("hidden");
      tabDrawBtn.className = "flex-1 py-1.5 rounded-lg bg-white text-[#1C1B8E] shadow-sm transition";
      tabUploadBtn.className = "flex-1 py-1.5 rounded-lg text-slate-500 hover:text-slate-800 transition";
    } else {
      drawContainer.classList.add("hidden");
      uploadContainer.classList.remove("hidden");
      tabUploadBtn.className = "flex-1 py-1.5 rounded-lg bg-white text-[#1C1B8E] shadow-sm transition";
      tabDrawBtn.className = "flex-1 py-1.5 rounded-lg text-slate-500 hover:text-slate-800 transition";
    }
  }

  function processSignatureImageToBlack(imgElement, callback) {
    var c = document.createElement("canvas");
    c.width = imgElement.naturalWidth || imgElement.width || 400;
    c.height = imgElement.naturalHeight || imgElement.height || 200;
    var ctx = c.getContext("2d");
    ctx.drawImage(imgElement, 0, 0, c.width, c.height);

    try {
      var imgData = ctx.getImageData(0, 0, c.width, c.height);
      var data = imgData.data;
      for (var i = 0; i < data.length; i += 4) {
        var r = data[i];
        var g = data[i + 1];
        var b = data[i + 2];
        var a = data[i + 3];

        // Hitung kecerahan pixel
        var brightness = 0.299 * r + 0.587 * g + 0.114 * b;

        // Jika latar belakang putih/terang atau transparan, buat transparan penuh
        if (brightness > 205 || a < 35) {
          data[i + 3] = 0;
        } else {
          // Seluruh piksel tinta (biru, abu-abu, dll.) diubah menjadi HITAM MURNI (#000000)
          data[i] = 0;     // Red
          data[i + 1] = 0; // Green
          data[i + 2] = 0; // Blue
          data[i + 3] = Math.min(255, Math.round(a * 1.3)); // Tegaskan ketebalan garis
        }
      }
      ctx.putImageData(imgData, 0, 0);
      callback(c.toDataURL("image/png"));
    } catch(err) {
      console.warn("Fallback direct image: ", err);
      callback(imgElement.src);
    }
  }

  function handleSigFileUpload(e) {
    var file = e.target.files[0];
    if (!file) return;

    var reader = new FileReader();
    reader.onload = function(evt) {
      var tempImg = new Image();
      tempImg.onload = function() {
        processSignatureImageToBlack(tempImg, function(blackDataUrl) {
          uploadedSignatureBase64 = blackDataUrl;
          var previewBox = document.getElementById("sigUploadPreviewBox");
          var img = document.getElementById("sigUploadedImg");
          if (previewBox && img) {
            img.src = uploadedSignatureBase64;
            previewBox.classList.remove("hidden");
          }
        });
      };
      tempImg.src = evt.target.result;
    };
    reader.readAsDataURL(file);
  }

  function openSignatureModal() {
    document.getElementById("signatureModal").classList.remove("hidden");
    clearSignatureCanvas();

    var currentSigWrapper = document.getElementById("currentSigPreviewWrapper");
    var currentSigImg = document.getElementById("currentSigImg");

    // Cek apakah akun aktif (Karyawan/PM) sudah memiliki TTD tersimpan
    if (currentUser && currentUser.signature) {
      currentSigImg.src = currentUser.signature;
      currentSigWrapper.classList.remove("hidden");
    } else {
      currentSigWrapper.classList.add("hidden");
    }

    switchSigTab('draw');
  }

  function closeSignatureModal() {
    document.getElementById("signatureModal").classList.add("hidden");
  }

  function isCanvasBlank(canvas) {
    var context = canvas.getContext('2d');
    var pixelBuffer = new Uint32Array(
      context.getImageData(0, 0, canvas.width, canvas.height).data.buffer
    );
    return !pixelBuffer.some(function(color) { return color !== 0; });
  }

  function saveSignatureData() {
    var finalSignatureBase64 = "";

    if (activeSigMode === "draw") {
      var canvas = document.getElementById("sigCanvas");
      if (isCanvasBlank(canvas)) {
        showToast("Tanda tangan pada canvas masih kosong!");
        return;
      }
      finalSignatureBase64 = canvas.toDataURL("image/png");
    } else {
      if (!uploadedSignatureBase64) {
        showToast("Harap pilih gambar tanda tangan terlebih dahulu!");
        return;
      }
      finalSignatureBase64 = uploadedSignatureBase64;
    }

    var uid = currentUser ? currentUser.user_id : 'USR-0003';
    var btn = document.getElementById("btnSaveSigSubmit");
    btn.disabled = true;
    btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin mr-1"></i> Menyimpan...';

    callBackend('saveUserSignature', [uid, finalSignatureBase64], function(res) {
      btn.disabled = false;
      btn.innerHTML = '<i class="fa-solid fa-check"></i> <span>Simpan Tanda Tangan</span>';

      if (res && res.success) {
        showToast("Tanda tangan digital berhasil diperbarui!");
        
        // Perbarui sesi lokal untuk Karyawan maupun PM
        if (currentUser) {
          currentUser.signature = finalSignatureBase64;
          localStorage.setItem("elms_session", JSON.stringify(currentUser));
        }

        // Segarkan pratinjau TTD aktif
        var currentSigWrapper = document.getElementById("currentSigPreviewWrapper");
        var currentSigImg = document.getElementById("currentSigImg");
        if (currentSigWrapper && currentSigImg) {
          currentSigImg.src = finalSignatureBase64;
          currentSigWrapper.classList.remove("hidden");
        }

        closeSignatureModal();
        loadOvertimeData();
      } else {
        showToast(res ? res.error : "Gagal menyimpan tanda tangan");
      }
    });
  }
</script>
