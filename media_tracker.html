  function base64ToUint8Array(base64) {
    var raw = atob(base64);
    var uint8Array = new Uint8Array(raw.length);
    for (var i = 0; i < raw.length; i++) {
      uint8Array[i] = raw.charCodeAt(i);
    }
    return uint8Array;
  }

  var pdfDoc = null;
  var pdfPageNum = 1;
  var pdfPageRendering = false;
  var pdfPageNumPending = null;
  var pdfReadPages = new Set();
  var pdfCurrentCourseId = null;
  var pdfPageTimer = null;

  var videoCurrentCourseId = null;
  var videoMaxWatchedTime = 0;
  var attentionTimer = null;

  function triggerAttentionCheck(mediaType) {
    if (attentionTimer) clearTimeout(attentionTimer);
    
    attentionTimer = setTimeout(function() {
      var modal = document.getElementById("pdfModal");
      var vModal = document.getElementById("videoModal");

      if ((modal && !modal.classList.contains("hidden")) || (vModal && !vModal.classList.contains("hidden"))) {
        if (typeof showToast === 'function') {
          showToast("🔔 Verifikasi Kehadiran: Anda masih menyimak " + mediaType + " ini.");
        }
      }
    }, 45000);
  }

  function initPdfTracker(pdfUrl, courseId) {
    pdfCurrentCourseId = courseId;
    pdfPageNum = 1;
    pdfReadPages.clear();
    triggerAttentionCheck("PDF SOP");

    var canvas = document.getElementById("pdfRenderCanvas");
    var iframe = document.getElementById("pdfFallbackIframe");
    if (!canvas || !iframe) return;

    var cleanUrl = (pdfUrl || "").trim();

    if (cleanUrl.indexOf("drive.google.com") !== -1) {
      canvas.classList.add("hidden");
      iframe.classList.remove("hidden");
      iframe.src = typeof convertToEmbedUrl === 'function' ? convertToEmbedUrl(cleanUrl) : cleanUrl;
      
      document.getElementById("pdfPageNum").innerText = "1";
      document.getElementById("pdfTotalPages").innerText = "1";
      document.getElementById("pdfScoreBadge").innerText = "Progress PDF: 100% (1/1 Hal Dibaca)";
      
      isCurrentPdfTracked = true;
      if (typeof updateMediaSequentialButtons === 'function') {
        updateMediaSequentialButtons();
      }

      var uid = currentUser ? currentUser.user_id : 'USR-0003';
      callBackend('recordUserProgress', [{
        user_id: uid,
        course_id: pdfCurrentCourseId,
        is_pdf_downloaded: true,
        pdf_score: 10,
        pages_read_count: 1,
        total_pages: 1
      }]);
      return;
    }

    iframe.classList.add("hidden");
    iframe.src = "";
    canvas.classList.remove("hidden");

    if (typeof pdfjsLib === 'undefined') {
      console.warn("PDF.js library belum dimuat.");
      return;
    }

    var loadSource;
    if (!cleanUrl || cleanUrl === "#" || cleanUrl.indexOf("http") === -1) {
      loadSource = { data: base64ToUint8Array(DEFAULT_SOP_PDF_BASE64) };
    } else {
      loadSource = cleanUrl;
    }

    pdfjsLib.getDocument(loadSource).promise.then(function(pdfDoc_) {
      pdfDoc = pdfDoc_;
      document.getElementById("pdfTotalPages").innerText = pdfDoc.numPages;
      renderPdfPage(pdfPageNum);
    }).catch(function(err) {
      console.warn("PDF.js CORS error. Using fallback PDF:", err);
      pdfjsLib.getDocument({ data: base64ToUint8Array(DEFAULT_SOP_PDF_BASE64) }).promise.then(function(fallbackDoc) {
        pdfDoc = fallbackDoc;
        document.getElementById("pdfTotalPages").innerText = pdfDoc.numPages;
        renderPdfPage(pdfPageNum);
      });
    });
  }

  function renderPdfPage(num) {
    if (!pdfDoc) return;
    pdfPageRendering = true;

    pdfDoc.getPage(num).then(function(page) {
      var canvas = document.getElementById("pdfRenderCanvas");
      if (!canvas) return;
      var ctx = canvas.getContext("2d");

      var scale = 1.4;
      var viewport = page.getViewport({ scale: scale });

      canvas.height = viewport.height;
      canvas.width = viewport.width;

      var renderContext = {
        canvasContext: ctx,
        viewport: viewport
      };

      var renderTask = page.render(renderContext);
      renderTask.promise.then(function() {
        pdfPageRendering = false;
        if (pdfPageNumPending !== null) {
          renderPdfPage(pdfPageNumPending);
          pdfPageNumPending = null;
        }

        startPdfPageDwellTimer(num);
      });
    });

    document.getElementById("pdfPageNum").innerText = num;
  }

  function queueRenderPdfPage(num) {
    if (pdfPageRendering) {
      pdfPageNumPending = num;
    } else {
      renderPdfPage(num);
    }
  }

  function changePdfPage(delta) {
    if (!pdfDoc) return;
    if (pdfPageNum + delta <= 0 || pdfPageNum + delta > pdfDoc.numPages) return;
    pdfPageNum += delta;
    queueRenderPdfPage(pdfPageNum);
  }

  function startPdfPageDwellTimer(pageNum) {
    if (pdfPageTimer) clearTimeout(pdfPageTimer);
    triggerAttentionCheck("PDF SOP");

    pdfPageTimer = setTimeout(function() {
      pdfReadPages.add(pageNum);
      var totalPages = pdfDoc ? pdfDoc.numPages : 1;
      var score = Math.round((pdfReadPages.size / totalPages) * 10);
      
      var badge = document.getElementById("pdfScoreBadge");
      if (badge) {
        badge.innerText = "Progress PDF: " + Math.round((pdfReadPages.size / totalPages) * 100) + "% (" + pdfReadPages.size + "/" + totalPages + " Hal Dibaca)";
      }
      
      if (score >= 8 || pdfReadPages.size >= totalPages) {
        isCurrentPdfTracked = true;
        if (typeof updateMediaSequentialButtons === 'function') {
          updateMediaSequentialButtons();
        }
      }

      var uid = currentUser ? currentUser.user_id : 'USR-0003';
      callBackend('recordUserProgress', [{
        user_id: uid,
        course_id: pdfCurrentCourseId,
        is_pdf_downloaded: true,
        pdf_score: score,
        pages_read_count: pdfReadPages.size,
        total_pages: totalPages
      }]);
    }, 5000);
  }

  function initVideoTracker(videoUrl, courseId) {
    videoCurrentCourseId = courseId;
    videoMaxWatchedTime = 0;
    triggerAttentionCheck("Video Pelatihan");

    var vPlayer = document.getElementById("html5VideoPlayer");
    var vIframe = document.getElementById("videoFrame");

    if (!vPlayer || !vIframe) return;

    if (videoUrl.indexOf("drive.google.com") !== -1 || videoUrl.indexOf("youtube.com") !== -1) {
      vPlayer.classList.add("hidden");
      vIframe.classList.remove("hidden");
      
      var embedUrl = typeof convertToEmbedUrl === 'function' ? convertToEmbedUrl(videoUrl) : videoUrl;
      vIframe.src = embedUrl;

      document.getElementById("videoScoreBadge").innerText = "Progress Video: 100% (Ditonton)";
      isCurrentVideoTracked = true;
      if (typeof updateMediaSequentialButtons === 'function') {
        updateMediaSequentialButtons();
      }

      var uid = currentUser ? currentUser.user_id : 'USR-0003';
      callBackend('recordUserProgress', [{
        user_id: uid,
        course_id: videoCurrentCourseId,
        is_video_watched: true,
        video_score: 10,
        video_seconds_watched: 750
      }]);
    } else {
      vIframe.classList.add("hidden");
      vIframe.src = "";
      vPlayer.classList.remove("hidden");
      vPlayer.src = videoUrl;

      vPlayer.ontimeupdate = function() {
        if (!vPlayer.seeking) {
          if (vPlayer.currentTime > videoMaxWatchedTime) {
            videoMaxWatchedTime = vPlayer.currentTime;
          }
        }

        var duration = vPlayer.duration || 1;
        var percentage = Math.min(100, Math.round((videoMaxWatchedTime / duration) * 100));
        var score = Math.min(10, Math.round((videoMaxWatchedTime / duration) * 10));
        
        document.getElementById("videoScoreBadge").innerText = "Progress Video: " + percentage + "% Ditonton";

        if (percentage >= 80 || vPlayer.ended) {
          isCurrentVideoTracked = true;
          if (typeof updateMediaSequentialButtons === 'function') {
            updateMediaSequentialButtons();
          }
        }

        var watchedSeconds = Math.round(videoMaxWatchedTime);
        var uid = currentUser ? currentUser.user_id : 'USR-0003';
        callBackend('recordUserProgress', [{
          user_id: uid,
          course_id: videoCurrentCourseId,
          is_video_watched: percentage >= 80,
          video_score: score,
          video_seconds_watched: watchedSeconds
        }]);
      };

      vPlayer.onseeking = function() {
        if (vPlayer.currentTime > videoMaxWatchedTime + 2) {
          vPlayer.currentTime = videoMaxWatchedTime;
          if (typeof showToast === 'function') {
            showToast("🔒 Video Guard: Dilarang melompat/mempercepat durasi! Harap tonton secara berurutan.");
          }
        }
      };
    }
  }

  function nextFromPdfToVideo() {
    if (typeof closePdfModal === 'function') closePdfModal();
    if (typeof trackVideo === 'function' && activeMediaCourseId) {
      trackVideo(activeMediaCourseId, activeMediaVideoUrl, activeMediaTitle, activeMediaPdfUrl);
    }
  }

  function backFromVideoToPdf() {
    if (typeof closeVideoModal === 'function') closeVideoModal();
    if (typeof trackPdf === 'function' && activeMediaCourseId) {
      trackPdf(activeMediaCourseId, activeMediaPdfUrl, activeMediaTitle, activeMediaVideoUrl);
    }
  }

  function openQuizFromMedia() {
    if (typeof closePdfModal === 'function') closePdfModal();
    if (typeof closeVideoModal === 'function') closeVideoModal();
    if (typeof openQuizModal === 'function' && activeMediaCourseId) {
      openQuizModal(activeMediaCourseId, activeMediaTitle);
    }
  }
