<script>
  /**
   * Anti-Cheating Engine & Interactive Media Tracker
   * System: e-LMS Data Center KSPS
   */

  // State PDF Tracker
  var currentPdfDoc = null;
  var currentPdfPage = 1;
  var totalPdfPages = 1;
  var pdfPageTimer = null;
  var pdfSecondsLeft = 5;
  var pdfHasScrolledBottom = false;
  var pdfTimerPaused = false;
  var activePdfCourseId = null;

  // State Video Tracker
  var maxVideoWatchedTime = 0;
  var isVideoCheckpointPassed = false;
  var videoCheckpointTriggered = false;
  var activeVideoCourseId = null;
  var iframeWatchInterval = null;

  document.addEventListener("DOMContentLoaded", function() {
    initTabVisibilityDetector();
  });

  /**
   * SMART FOCUS & TAB VISIBILITY DETECTOR
   * Menghentikan timer PDF & Video saat pengguna berpindah tab/layar secara senyap.
   */
  function initTabVisibilityDetector() {
    document.addEventListener("visibilitychange", function() {
      if (document.hidden) {
        pdfTimerPaused = true;
        
        var html5Vid = document.getElementById("html5VideoPlayer");
        if (html5Vid && !html5Vid.paused) {
          html5Vid.pause();
        }

        var pdfBanner = document.getElementById("pdfTimerNotice");
        if (pdfBanner) {
          pdfBanner.innerHTML = '<span class="text-rose-600 font-bold"><i class="fa-solid fa-pause mr-1"></i> Timer Di-Pause (Tab Tidak Aktif)</span>';
        }
      } else {
        pdfTimerPaused = false;
      }
    });
  }

  function syncPdfProgress() {
    if (!activePdfCourseId) return;
    var uid = currentUser ? currentUser.user_id : 'USR-0003';
    var totalPages = totalPdfPages > 0 ? totalPdfPages : 1;
    
    callBackend('recordUserProgress', [{
      user_id: uid,
      course_id: activePdfCourseId,
      pages_read_count: currentPdfPage,
      total_pages: totalPages,
      is_pdf_downloaded: currentPdfPage === totalPages
    }], function(res) {
      // Quiet background progress sync
    });
  }

  function initPdfTracker(pdfUrl, courseId) {
    activePdfCourseId = courseId;
    currentPdfPage = 1;
    totalPdfPages = 1;
    pdfHasScrolledBottom = false;

    var canvas = document.getElementById("pdfRenderCanvas");
    var fallbackIframe = document.getElementById("pdfFallbackIframe");
    var container = document.getElementById("pdfCanvasContainer");
    var noticeEl = document.getElementById("pdfTimerNotice");

    if (noticeEl) {
      noticeEl.innerHTML = '<span class="text-amber-600 font-bold"><i class="fa-solid fa-circle-notch fa-spin mr-1"></i> Memuat Berkas PDF...</span>';
    }

    if (window.pdfjsLib) {
      pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
      
      canvas.classList.remove("hidden");
      fallbackIframe.classList.add("hidden");

      // Mengambil PDF sebagai Stream Base64 dari backend agar aman dari pembatasan Iframe Google Drive
      callBackend('getPdfBase64', [pdfUrl], function(res) {
        if (res && res.success && res.base64) {
          try {
            var raw = window.atob(res.base64);
            var rawLength = raw.length;
            var array = new Uint8Array(new ArrayBuffer(rawLength));
            for (var i = 0; i < rawLength; i++) {
              array[i] = raw.charCodeAt(i);
            }

            pdfjsLib.getDocument({ data: array }).promise.then(function(pdf) {
              currentPdfDoc = pdf;
              totalPdfPages = pdf.numPages;
              document.getElementById("pdfTotalPages").innerText = totalPdfPages;
              renderPdfPage(1);
            }).catch(function(err) {
              console.warn("PDF.js Base64 Render Failed: ", err);
              usePdfIframeFallback(pdfUrl);
            });
          } catch(e) {
            usePdfIframeFallback(pdfUrl);
          }
        } else {
          // Direct URL Render Fallback
          pdfjsLib.getDocument(pdfUrl).promise.then(function(pdf) {
            currentPdfDoc = pdf;
            totalPdfPages = pdf.numPages;
            document.getElementById("pdfTotalPages").innerText = totalPdfPages;
            renderPdfPage(1);
          }).catch(function(err) {
            usePdfIframeFallback(pdfUrl);
          });
        }
      });
    } else {
      usePdfIframeFallback(pdfUrl);
    }

    if (container) {
      container.onscroll = function() {
        if (container.scrollTop + container.clientHeight >= container.scrollHeight - 35) {
          pdfHasScrolledBottom = true;
          checkPdfPageGateStatus();
        }
      };
    }

    syncPdfProgress();
  }

  function usePdfIframeFallback(pdfUrl) {
    var canvas = document.getElementById("pdfRenderCanvas");
    var fallbackIframe = document.getElementById("pdfFallbackIframe");
    canvas.classList.add("hidden");
    fallbackIframe.classList.remove("hidden");
    fallbackIframe.src = convertToEmbedUrl(pdfUrl);
    unlockPdfNextButton();
    var noticeEl = document.getElementById("pdfTimerNotice");
    if (noticeEl) {
      noticeEl.innerHTML = '<span class="text-emerald-600 font-bold"><i class="fa-solid fa-circle-check mr-1"></i> Mode Pratinjau Terbuka</span>';
    }
  }

  function renderPdfPage(pageNum) {
    if (!currentPdfDoc) return;
    currentPdfPage = pageNum;
    document.getElementById("pdfPageNum").innerText = pageNum;

    pdfSecondsLeft = 5;
    pdfHasScrolledBottom = false;
    lockPdfNextButton();

    currentPdfDoc.getPage(pageNum).then(function(page) {
      var canvas = document.getElementById("pdfRenderCanvas");
      var ctx = canvas.getContext('2d');
      var viewport = page.getViewport({ scale: 1.25 });

      canvas.height = viewport.height;
      canvas.width = viewport.width;

      var renderContext = {
        canvasContext: ctx,
        viewport: viewport
      };
      page.render(renderContext);
    });

    startPdfPageTimer();
    syncPdfProgress();
  }

  function startPdfPageTimer() {
    if (pdfPageTimer) clearInterval(pdfPageTimer);

    pdfPageTimer = setInterval(function() {
      if (pdfTimerPaused) return;

      pdfSecondsLeft--;
      var noticeEl = document.getElementById("pdfTimerNotice");

      if (pdfSecondsLeft > 0) {
        if (noticeEl) noticeEl.innerHTML = '<span class="text-amber-600 font-bold"><i class="fa-solid fa-clock mr-1"></i> Baca Halaman Ini (' + pdfSecondsLeft + 's & Scroll ke Bawah)</span>';
      } else {
        clearInterval(pdfPageTimer);
        checkPdfPageGateStatus();
      }
    }, 1000);
  }

  function checkPdfPageGateStatus() {
    var noticeEl = document.getElementById("pdfTimerNotice");
    if (pdfSecondsLeft <= 0 && pdfHasScrolledBottom) {
      unlockPdfNextButton();
      if (noticeEl) noticeEl.innerHTML = '<span class="text-emerald-600 font-bold"><i class="fa-solid fa-circle-check mr-1"></i> Syarat Halaman Terpenuhi</span>';
    } else if (pdfSecondsLeft <= 0 && !pdfHasScrolledBottom) {
      if (noticeEl) noticeEl.innerHTML = '<span class="text-amber-600 font-bold"><i class="fa-solid fa-arrow-down mr-1"></i> Silakan Scroll Hingga Dasar Halaman</span>';
    }
  }

  function lockPdfNextButton() {
    var btn = document.getElementById("pdfNextBtn");
    if (btn) {
      btn.disabled = true;
      btn.classList.add("opacity-50", "cursor-not-allowed");
    }
  }

  function unlockPdfNextButton() {
    var btn = document.getElementById("pdfNextBtn");
    if (btn) {
      btn.disabled = false;
      btn.classList.remove("opacity-50", "cursor-not-allowed");
    }
    syncPdfProgress();
  }

  function changePdfPage(delta) {
    var newPage = currentPdfPage + delta;
    if (newPage >= 1 && newPage <= totalPdfPages) {
      renderPdfPage(newPage);
    }
  }

  function syncVideoProgress() {
    if (!activeVideoCourseId) return;
    var uid = currentUser ? currentUser.user_id : 'USR-0003';
    var secondsWatched = Math.round(maxVideoWatchedTime);
    var isWatched = secondsWatched >= 300 || isVideoCheckpointPassed;

    callBackend('recordUserProgress', [{
      user_id: uid,
      course_id: activeVideoCourseId,
      is_video_watched: isWatched,
      video_seconds_watched: secondsWatched
    }], function(res) {
      // Quiet background progress sync
    });
  }

  function initVideoTracker(videoUrl, courseId) {
    activeVideoCourseId = courseId;
    maxVideoWatchedTime = 0;
    isVideoCheckpointPassed = false;
    videoCheckpointTriggered = false;

    stopIframeWatchTimer();

    var html5Vid = document.getElementById("html5VideoPlayer");
    var iframeVid = document.getElementById("videoFrame");
    var embedUrl = convertToEmbedUrl(videoUrl);

    if (html5Vid) {
      html5Vid.pause();
      html5Vid.removeAttribute("src");
      html5Vid.load();
    }

    if (videoUrl && videoUrl.match(/\.(mp4|webm|ogg)(\?.*)?$/i)) {
      html5Vid.classList.remove("hidden");
      iframeVid.classList.add("hidden");
      iframeVid.src = "";
      html5Vid.src = videoUrl;

      html5Vid.ontimeupdate = function() {
        if (html5Vid.currentTime > maxVideoWatchedTime + 2.0) {
          html5Vid.currentTime = maxVideoWatchedTime;
        } else {
          maxVideoWatchedTime = Math.max(maxVideoWatchedTime, html5Vid.currentTime);
        }

        var duration = html5Vid.duration || 0;
        if (duration > 10 && html5Vid.currentTime >= duration / 2 && !isVideoCheckpointPassed && !videoCheckpointTriggered) {
          videoCheckpointTriggered = true;
          html5Vid.pause();
          triggerVideoCheckpointModal();
        }

        syncVideoProgress();
      };

      html5Vid.onended = function() {
        maxVideoWatchedTime = Math.max(maxVideoWatchedTime, html5Vid.duration || 300);
        syncVideoProgress();
      };

    } else {
      // Pemutar Iframe Google Drive / YouTube
      if (html5Vid) html5Vid.classList.add("hidden");
      iframeVid.classList.remove("hidden");
      iframeVid.src = embedUrl;

      startIframeWatchTimer();
    }
  }

  function startIframeWatchTimer() {
    if (iframeWatchInterval) clearInterval(iframeWatchInterval);
    iframeWatchInterval = setInterval(function() {
      if (pdfTimerPaused) return;

      maxVideoWatchedTime += 1;

      if (maxVideoWatchedTime >= 60 && !isVideoCheckpointPassed && !videoCheckpointTriggered) {
        videoCheckpointTriggered = true;
        triggerVideoCheckpointModal();
      }

      if (Math.round(maxVideoWatchedTime) % 10 === 0) {
        syncVideoProgress();
      }
    }, 1000);
  }

  function stopIframeWatchTimer() {
    if (iframeWatchInterval) {
      clearInterval(iframeWatchInterval);
      iframeWatchInterval = null;
    }
  }

  function triggerVideoCheckpointModal() {
    var modal = document.getElementById("videoCheckpointModal");
    if (modal) {
      modal.classList.remove("hidden");
    }
  }

  function handleCheckpointAnswer(selectedOption) {
    if (selectedOption === 'B') {
      isVideoCheckpointPassed = true;
      document.getElementById("videoCheckpointModal").classList.add("hidden");
      
      var html5Vid = document.getElementById("html5VideoPlayer");
      if (html5Vid && !html5Vid.classList.contains("hidden")) {
        html5Vid.play();
      }
      syncVideoProgress();
    }
  }
</script>
